<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Robô">

    <link rel="manifest" href="manifest.json">

    <title>Robô Interativo</title>

    <style>
        :root {
            --eye-white: #f0faff;
            --dark-bg: #050505;
            --glow-soft: rgba(240, 250, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;

            background: var(--dark-bg);

            overflow: hidden;

            cursor: pointer;

            touch-action: manipulation;
            overscroll-behavior: none;

            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100dvh;

            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
        }

        /* =========================================
           ORIENTAÇÃO
        ========================================= */

        #orientation-overlay {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: #000;
            color: #fff;

            z-index: 99999;

            display: none;

            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            font-family: Arial, sans-serif;
        }

        #orientation-overlay div {
            font-size: 50px;
        }

        #orientation-overlay p {
            margin-top: 15px;
            font-size: 18px;
        }

        @media (orientation: portrait) {

            #orientation-overlay {
                display: flex;
            }

        }

        /* =========================================
           ROSTO
        ========================================= */

        .face-container {

            display: flex;

            flex-direction: column;

            align-items: center;

            animation:
                float 5s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }

        }

        /* =========================================
           LINHA DOS OLHOS
        ========================================= */

        .eyes-row {

            display: flex;

            gap: 100px;

            align-items: center;
        }

        /* =========================================
           OLHO
        ========================================= */

        .eye {

            width: 155px;
            height: 130px;

            background: var(--eye-white);

            border-radius: 80px;

            box-shadow:
                0 0 30px var(--glow-soft);

            transition:
                all 0.4s cubic-bezier(
                    0.175,
                    0.885,
                    0.32,
                    1.275
                );
        }

        /* =========================================
           DORMINDO
        ========================================= */

        .sleeping .eye {

            height: 8px;

            width: 120px;

            opacity: 0.2;

            border-radius: 4px;
        }

        /* =========================================
           FELIZ
        ========================================= */

        .happy .eye {

            height: 75px;

            background: transparent;

            border-top:
                25px solid var(--eye-white);

            border-radius:
                100px 100px 0 0;

            box-shadow: none;

            transform:
                translateY(25px);
        }

        /* =========================================
           PENSANDO
        ========================================= */

        .thinking #eye-l {

            height: 130px;

            width: 150px;
        }

        .thinking #eye-r {

            height: 90px;

            width: 150px;
        }

        /* =========================================
           RINDO
        ========================================= */

        .laughing .eye {

            height: 40px;

            width: 140px;

            transform:
                skewX(10deg);
        }

        /* =========================================
           PISCANDO
        ========================================= */

        .blink .eye {

            transform:
                scaleY(0) !important;
        }

        /* =========================================
           CELULARES
        ========================================= */

        @media (max-width: 700px) {

            .eyes-row {

                gap: 50px;
            }

            .eye {

                width: 110px;

                height: 95px;
            }

            .sleeping .eye {

                width: 90px;

                height: 7px;
            }

            .happy .eye {

                width: 105px;
            }

            .thinking #eye-l,
            .thinking #eye-r {

                width: 105px;
            }

            .laughing .eye {

                width: 100px;
            }

        }

        /* =========================================
           CELULAR DEITADO
        ========================================= */

        @media (max-height: 500px) and (orientation: landscape) {

            .eye {

                width: 120px;

                height: 105px;
            }

            .eyes-row {

                gap: 70px;
            }

        }

    </style>

</head>

<body class="sleeping">

    <!-- =========================================
         AVISO PARA GIRAR O CELULAR
    ========================================= -->

    <div id="orientation-overlay">

        <div>
            📱🔄
        </div>

        <p>
            Gire o dispositivo para deitado.
        </p>

    </div>


    <!-- =========================================
         ROSTO DO ROBÔ
    ========================================= -->

    <div class="face-container">

        <div class="eyes-row">

            <div
                id="eye-l"
                class="eye">
            </div>

            <div
                id="eye-r"
                class="eye">
            </div>

        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        /* =========================================
           VARIÁVEIS
        ========================================= */

        const body = document.body;

        let recognitionActive = false;

        let robotSpeaking = false;

        let step = 2;

        let userName = "";

        let speechVoices = [];


        /* =========================================
           RECONHECIMENTO DE VOZ
        ========================================= */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            alert(
                "Seu navegador não suporta reconhecimento de voz."
            );

        }


        const recognition =
            SpeechRecognition
                ? new SpeechRecognition()
                : null;


        if (recognition) {

            recognition.lang = "pt-BR";

            recognition.continuous = false;

            recognition.interimResults = false;

            recognition.maxAlternatives = 1;

        }


        /* =========================================
           CARREGAR VOZES DO DISPOSITIVO
        ========================================= */

        function carregarVozes() {

            speechVoices =
                window.speechSynthesis.getVoices();

        }


        carregarVozes();


        if (
            "onvoiceschanged"
            in window.speechSynthesis
        ) {

            window.speechSynthesis.onvoiceschanged =
                carregarVozes;

        }


        /* =========================================
           ENCONTRAR VOZ BRASILEIRA
        ========================================= */

        function encontrarVozBrasileira() {

            if (!speechVoices.length) {

                speechVoices =
                    window.speechSynthesis.getVoices();

            }


            /*
             * Primeiro tenta português brasileiro.
             */

            let voz =
                speechVoices.find(
                    voice =>
                        voice.lang.toLowerCase() ===
                        "pt-br"
                );


            /*
             * Depois qualquer voz pt.
             */

            if (!voz) {

                voz =
                    speechVoices.find(
                        voice =>
                            voice.lang
                                .toLowerCase()
                                .startsWith("pt")
                    );

            }


            return voz || null;

        }


        /* =========================================
           FALAR
        ========================================= */

        function falar(texto, callback) {

            robotSpeaking = true;


            /*
             * Para o microfone enquanto o robô fala.
             */

            if (
                recognition &&
                recognitionActive
            ) {

                try {

                    recognition.stop();

                } catch (e) {}

            }


            /*
             * Cancela qualquer fala anterior.
             */

            window.speechSynthesis.cancel();


            const msg =
                new SpeechSynthesisUtterance(texto);


            /*
             * PORTUGUÊS BRASILEIRO
             */

            msg.lang = "pt-BR";


            /*
             * VOZ MAIS GRAVE
             *
             * Quanto menor o pitch,
             * mais grave fica.
             */

            msg.pitch = 0.60;


            /*
             * Um pouco mais lenta para
             * parecer uma voz de robô.
             */

            msg.rate = 0.90;


            /*
             * Volume máximo.
             */

            msg.volume = 1.0;


            /*
             * Seleciona voz brasileira
             * disponível no aparelho.
             */

            const voz =
                encontrarVozBrasileira();


            if (voz) {

                msg.voice = voz;

            }


            /*
             * Quando começa a falar.
             */

            msg.onstart = () => {

                robotSpeaking = true;

                body.className = "awake";

            };


            /*
             * Quando termina.
             */

            msg.onend = () => {

                robotSpeaking = false;


                /*
                 * Aguarda um pouco para evitar
                 * que o robô escute o próprio áudio.
                 */

                setTimeout(() => {

                    if (
                        recognition &&
                        recognitionActive
                    ) {

                        try {

                            recognition.start();

                        } catch (e) {}

                    }

                }, 500);


                if (callback) {

                    callback();

                }

            };


            /*
             * Caso ocorra erro na fala.
             */

            msg.onerror = () => {

                robotSpeaking = false;

            };


            window.speechSynthesis.speak(msg);

        }


        /* =========================================
           PIADA
        ========================================= */

        function contarPiada() {

            body.className = "awake";


            falar(

                "Sabe por que o robô foi ao médico? Porque ele estava com um vírus! Rá! Rá! Rá! Rá!",

                () => {

                    body.className =
                        "laughing";


                    setTimeout(() => {

                        body.className =
                            "awake";


                        falar(

                            "O papo está bom, mas minha bateria está acabando, vou voltar a dormir. Tchau tchau!",

                            () => {

                                body.className =
                                    "sleeping";


                                recognitionActive =
                                    false;


                                if (recognition) {

                                    try {

                                        recognition.stop();

                                    } catch (e) {}

                                }

                            }

                        );

                    }, 2000);

                }

            );

        }


        /* =========================================
           PISCADA
        ========================================= */

        setInterval(() => {

            if (
                !body.classList.contains(
                    "sleeping"
                )
            ) {

                body.classList.add(
                    "blink"
                );


                setTimeout(() => {

                    body.classList.remove(
                        "blink"
                    );

                }, 150);

            }

        }, 4000);


        /* =========================================
           ACORDAR ROBÔ
        ========================================= */

        function acordarRobo() {

            if (
                !recognitionActive &&
                recognition
            ) {

                body.className =
                    "awake";


                recognitionActive =
                    true;


                try {

                    recognition.start();


                    falar(

                        "Olá! Eu sou o robozinho. Qual seu nome?",

                        () => {

                            step = 2;

                        }

                    );

                }

                catch (error) {

                    console.log(
                        "Erro ao inicializar escuta:",
                        error
                    );


                    recognitionActive =
                        false;

                }

            }

        }


        /* =========================================
           CLIQUE / TOQUE
        ========================================= */

        window.addEventListener(
            "click",
            acordarRobo
        );


        /* =========================================
           RECONHECIMENTO DE VOZ
        ========================================= */

        if (recognition) {


            recognition.onresult =
                (event) => {

                    /*
                     * Se o robô estiver falando,
                     * ignora o microfone.
                     */

                    if (robotSpeaking) {

                        return;

                    }


                    const last =
                        event.results.length - 1;


                    const fala =
                        event.results[last][0]
                            .transcript
                            .toLowerCase()
                            .trim();


                    console.log(
                        "Usuário disse:",
                        fala
                    );


                    /* =================================
                       COMANDO SOBRE PROGRAMAÇÃO
                    ================================= */

                    if (
                        fala.includes(
                            "programado"
                        ) ||
                        fala.includes(
                            "linguagem"
                        )
                    ) {

                        falar(

                            "Eu fui elaborado totalmente em JavaScript! É a linguagem que me dá vida."

                        );

                        return;

                    }


                    /* =================================
                       PASSO 2 — NOME
                    ================================= */

                    if (step === 2) {

                        userName =
                            fala
                                .split(" ")
                                .pop();


                        /* =============================
                           VANESSA
                        ============================= */

                        if (
                            fala.includes(
                                "vanessa"
                            ) ||
                            fala.includes(
                                "wanessa"
                            )
                        ) {

                            body.className =
                                "happy";


                            falar(

                                "Busquei aqui no meu banco de dados... Vanessa é diretora da escola Amácio Mazzaropi, muito prazer em te conhecer!"

                            );

                        }


                        /* =============================
                           CAROL
                        ============================= */

                        else if (
                            fala.includes(
                                "carol"
                            )
                        ) {

                            body.className =
                                "happy";


                            falar(

                                "Espere! Busquei aqui no meu banco de dados e vi que você é professora de matemática da escola Amácio Mazzaroppi, essa vai pro céu direto!"

                            );

                        }


                        /* =============================
                           EDCARMEN
                        ============================= */

                        else if (
                            fala.includes(
                                "edcarmen"
                            ) ||
                            fala.includes(
                                "edicarmen"
                            )
                        ) {

                            falar(

                                "Busquei aqui no meu banco de dados e vi que você é coordenadora da escola Amácio Mazzaropi, muito bom te conhecer!"

                            );

                        }


                        /* =============================
                           RAFAEL
                        ============================= */

                        else if (
                            fala.includes(
                                "rafael"
                            )
                        ) {

                            body.className =
                                "thinking";


                            falar(

                                "Rafael... busquei aqui no meu banco de dados e existem três rafaéis, um aluno, um professor e um coordenador. Qual você é?",

                                () => {

                                    step =
                                        "rafael_check";

                                }

                            );


                            return;

                        }


                        /* =============================
                           NEUSIENE
                        ============================= */

                        else if (
                            fala.includes(
                                "neusiene"
                            )
                        ) {

                            body.className =
                                "happy";


                            falar(

                                "Espere! Busquei aqui no meu banco de dados e vi que você vai se aposentar! Parabéns!"

                            );

                        }


                        /* =============================
                           RONALDO
                        ============================= */

                        else if (
                            fala.includes(
                                "ronaldo"
                            )
                        ) {

                            falar(

                                "Espere! Busquei aqui no meu banco de dados e vi que você é professor de matemática, legal te conhecer!"

                            );

                        }


                        /* =============================
                           LARA
                        ============================= */

                        else if (
                            fala.includes(
                                "lara"
                            )
                        ) {

                            falar(

                                "Hi, teacher! Busquei aqui no meu banco de dados e vi que você é professora de português e inglês na escola Amácio Mazzaropi."

                            );

                        }


                        /* =============================
                           LUIZA
                        ============================= */

                        else if (
                            fala.includes(
                                "luiza"
                            )
                        ) {

                            body.className =
                                "happy";


                            falar(
                                "Ah, oi mãe!"
                            );

                        }


                        /* =============================
                           OUTRO NOME
                        ============================= */

                        else {

                            falar(

                                `Oi ${userName}! Legal te conhecer!`

                            );

                        }


                        /*
                         * Continua para a explicação
                         * do projeto.
                         */

                        setTimeout(() => {

                            if (step !== 2) {

                                return;

                            }


                            body.className =
                                "thinking";


                            falar(

                                "Você sabia que eu sou o protótipo de um projeto educacional? Estou aqui hoje para explicar aos alunos como se ensina algo sem ser aquela coisa robotizada e chata, sabe?",

                                () => {

                                    step = 3;

                                }

                            );

                        }, 4000);

                    }


                    /* =================================
                       RAFAEL
                    ================================= */

                    else if (
                        step === "rafael_check"
                    ) {

                        falar(

                            "Legal te conhecer!",

                            () => {

                                step = 3;

                            }

                        );

                    }


                    /* =================================
                       PASSO 3
                    ================================= */

                    else if (
                        step === 3
                    ) {

                        body.className =
                            "awake";


                        falar(

                            "Pois é! O segredo é que, mesmo sendo um robô, eu tenho o intuito de ensinar seres humanos. Posso te ajudar em algo a mais?",

                            () => {

                                step = 4;

                            }

                        );

                    }


                    /* =================================
                       PASSO 4
                    ================================= */

                    else if (
                        step === 4
                    ) {


                        if (
                            fala.includes(
                                "horas"
                            ) ||
                            fala.includes(
                                "dia"
                            )
                        ) {

                            const agora =
                                new Date();


                            const tempo =
                                agora.toLocaleTimeString(
                                    "pt-BR",
                                    {
                                        hour:
                                            "2-digit",

                                        minute:
                                            "2-digit"
                                    }
                                );


                            falar(

                                `Agora são exatamente ${tempo}. E por falar nisso, você quer ouvir uma piada?`,

                                () => {

                                    step =
                                        "decisao_piada";

                                }

                            );

                        }

                        else {

                            falar(

                                "Entendi. Mas antes de eu ir, você quer ouvir uma piada?",

                                () => {

                                    step =
                                        "decisao_piada";

                                }

                            );

                        }

                    }


                    /* =================================
                       DECISÃO DA PIADA
                    ================================= */

                    else if (
                        step ===
                        "decisao_piada"
                    ) {


                        if (
                            fala.includes(
                                "sim"
                            ) ||
                            fala.includes(
                                "quero"
                            ) ||
                            fala.includes(
                                "pode"
                            )
                        ) {

                            contarPiada();

                        }


                        else if (
                            fala.includes(
                                "não"
                            ) ||
                            fala.includes(
                                "nao"
                            )
                        ) {

                            falar(

                                "Ah, vou contar mesmo assim, porque eu sou um robô muito engraçado!",

                                () => {

                                    contarPiada();

                                }

                            );

                        }

                    }

                };


            /* =========================================
               MICROFONE TERMINOU
            ========================================= */

            recognition.onend =
                () => {

                    if (
                        recognitionActive &&
                        !robotSpeaking
                    ) {

                        setTimeout(() => {

                            try {

                                recognition.start();

                            } catch (e) {}

                        }, 300);

                    }

                };


            /* =========================================
               ERRO DO MICROFONE
            ========================================= */

            recognition.onerror =
                (event) => {

                    console.log(
                        "Erro no reconhecimento:",
                        event.error
                    );

                };

        }


        /* =========================================
           EVITAR ZOOM POR GESTOS
        ========================================= */

        document.addEventListener(
            "gesturestart",
            function (event) {

                event.preventDefault();

            }
        );


        document.addEventListener(
            "gesturechange",
            function (event) {

                event.preventDefault();

            }
        );


        document.addEventListener(
            "gestureend",
            function (event) {

                event.preventDefault();

            }
        );


        /* =========================================
           TENTAR TELA CHEIA
        ========================================= */

        async function entrarTelaCheia() {

            try {

                if (
                    document.documentElement
                        .requestFullscreen
                ) {

                    await document.documentElement
                        .requestFullscreen();

                }

            } catch (e) {

                console.log(
                    "Tela cheia controlada pelo navegador."
                );

            }

        }


        /*
         * Em alguns navegadores, fullscreen
         * só pode ser chamado após interação
         * do usuário.
         */

        window.addEventListener(
            "click",
            () => {

                entrarTelaCheia();

            },
            {
                once: true
            }
        );

    </script>

</body>

</html>
