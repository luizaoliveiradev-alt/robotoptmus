<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#050505">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Robô Interativo</title>

<style>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #050505;

    overflow: hidden;

    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;

    overscroll-behavior: none;
}

body {

    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 100dvh;

    cursor: pointer;
}


/* =========================================================
   ORIENTAÇÃO
========================================================= */

#orientation-overlay {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: #fff;

    z-index: 999999;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    font-family: Arial, sans-serif;
}

#orientation-overlay div {

    font-size: 55px;

    margin-bottom: 15px;
}

#orientation-overlay p {

    margin: 0;

    font-size: 18px;
}


/* =========================================================
   MOSTRAR AVISO SOMENTE EM PÉ
========================================================= */

@media (orientation: portrait) {

    #orientation-overlay {

        display: flex;

    }

}


/* =========================================================
   ROSTO
========================================================= */

.face-container {

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    animation:
        flutuar 5s ease-in-out infinite;
}

@keyframes flutuar {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-12px);

    }

}


/* =========================================================
   OLHOS
========================================================= */

.eyes-row {

    width: 100vw;

    display: flex;

    align-items: center;
    justify-content: center;

    gap:
        clamp(60px, 11vw, 160px);
}


.eye {

    width:
        clamp(170px, 22vw, 330px);

    height:
        clamp(150px, 20vw, 290px);

    background:
        #f0faff;

    border-radius: 80px;

    box-shadow:

        0 0 30px
        rgba(240,250,255,.15),

        0 0 70px
        rgba(240,250,255,.07);

    transition:

        all .4s
        cubic-bezier(
            .175,
            .885,
            .32,
            1.275
        );
}


/* =========================================================
   DORMINDO
========================================================= */

.sleeping .eye {

    width:
        clamp(140px,18vw,260px);

    height: 8px;

    opacity: .2;

    border-radius: 4px;
}


/* =========================================================
   FELIZ
========================================================= */

.happy .eye {

    height:
        clamp(70px,10vw,130px);

    background: transparent;

    border-top:
        clamp(18px,2.5vw,30px)
        solid
        #f0faff;

    border-radius:
        100px 100px 0 0;

    box-shadow: none;

    transform:
        translateY(25px);
}


/* =========================================================
   PENSANDO
========================================================= */

.thinking #eye-l {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(150px,20vw,290px);
}


.thinking #eye-r {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(100px,15vw,210px);
}


/* =========================================================
   RINDO
========================================================= */

.laughing .eye {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(40px,6vw,75px);

    transform:
        skewX(10deg);
}


/* =========================================================
   PISCADA
========================================================= */

.blink .eye {

    transform:
        scaleY(0) !important;
}


/* =========================================================
   CELULAR DEITADO
========================================================= */

@media (max-height:500px)
and (orientation:landscape) {

    .eye {

        width: 20vw;

        height: 17vw;

        max-width: 330px;
        max-height: 260px;

    }

    .eyes-row {

        gap: 10vw;

    }

}

</style>

</head>


<body class="sleeping">


<div id="orientation-overlay">

    <div>📱🔄</div>

    <p>
        Gire o dispositivo para deitado.
    </p>

</div>


<div class="face-container">

    <div class="eyes-row">

        <div
            id="eye-l"
            class="eye">
        </div>

        <div
            id="eye-r"
            class="eye">
        </div>

    </div>

</div>


<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

const body =
    document.body;

let recognition = null;

let recognitionActive = false;

let recognitionStarting = false;

let robotSpeaking = false;

let robotAwake = false;

let step = "nome";

let wakeLock = null;

let voices = [];


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "pt-BR";

    /*
     * FALSE deixa cada resposta
     * ser processada individualmente.
     */

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        3;

}


/* =========================================================
   VOZES
========================================================= */

function carregarVozes() {

    voices =
        window.speechSynthesis
            .getVoices();

}

carregarVozes();

window.speechSynthesis
    .onvoiceschanged =
    carregarVozes;


/* =========================================================
   ESCOLHER VOZ
========================================================= */

function escolherVoz() {

    carregarVozes();

    let voz =
        voices.find(
            v =>
                v.lang &&
                v.lang
                    .toLowerCase()
                    .includes("pt-br")
        );


    if (!voz) {

        voz =
            voices.find(
                v =>
                    v.lang &&
                    v.lang
                        .toLowerCase()
                        .startsWith("pt")
            );

    }


    return voz || null;

}


/* =========================================================
   FULLSCREEN
========================================================= */

function entrarFullscreen() {

    try {

        if (
            document.fullscreenElement
        ) {

            return;

        }


        const tela =
            document.documentElement;


        if (
            tela.requestFullscreen
        ) {

            tela.requestFullscreen()
                .catch(() => {});

            return;

        }


        if (
            tela.webkitRequestFullscreen
        ) {

            tela.webkitRequestFullscreen();

        }

    }
    catch (erro) {

        console.log(
            "Fullscreen:",
            erro
        );

    }

}


/* =========================================================
   TELA SEMPRE ACESA
========================================================= */

function manterTelaAcesa() {

    if (
        !("wakeLock" in navigator)
    ) {

        return;

    }


    if (
        wakeLock &&
        !wakeLock.released
    ) {

        return;

    }


    navigator.wakeLock
        .request("screen")

        .then(lock => {

            wakeLock =
                lock;

        })

        .catch(() => {});

}


/* =========================================================
   RECUPERAR TELA
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            manterTelaAcesa();

        }

    }
);


/* =========================================================
   FALA DO ROBÔ
========================================================= */

function falar(
    texto,
    callback
) {

    robotSpeaking =
        true;


    /*
     * Para o microfone para o robô
     * não ouvir a própria voz.
     */

    if (recognition) {

        try {

            recognition.stop();

        }
        catch (e) {}

    }


    recognitionActive =
        false;


    window.speechSynthesis
        .cancel();


    const mensagem =
        new SpeechSynthesisUtterance(
            texto
        );


    mensagem.lang =
        "pt-BR";


    /*
     * VOZ MAIS GRAVE
     */

    mensagem.pitch =
        0.72;


    /*
     * FALA MAIS DEVAGAR
     */

    mensagem.rate =
        0.82;


    mensagem.volume =
        1;


    const voz =
        escolherVoz();


    if (voz) {

        mensagem.voice =
            voz;

    }


    mensagem.onend =
        () => {

            robotSpeaking =
                false;


            /*
             * Pequena pausa para a pessoa
             * começar a responder.
             */

            if (
                robotAwake
            ) {

                setTimeout(
                    () => {

                        iniciarMicrofone();

                    },
                    900
                );

            }


            if (callback) {

                callback();

            }

        };


    mensagem.onerror =
        () => {

            robotSpeaking =
                false;

        };


    window.speechSynthesis
        .speak(
            mensagem
        );

}


/* =========================================================
   MICROFONE
========================================================= */

function iniciarMicrofone() {

    if (!recognition) {

        return;

    }


    if (
        recognitionActive ||
        recognitionStarting ||
        robotSpeaking ||
        !robotAwake
    ) {

        return;

    }


    recognitionStarting =
        true;


    try {

        recognition.start();

    }

    catch (erro) {

        recognitionStarting =
            false;

        console.log(
            "Microfone:",
            erro
        );

    }

}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizar(texto) {

    return texto

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[.,!?;:]/g,
            ""
        )

        .trim();

}


/* =========================================================
   EXTRAIR NOME
========================================================= */

function extrairNome(
    fala
) {

    let texto =
        normalizar(
            fala
        );


    texto =
        texto.replace(
            /^meu nome e\s+/,
            ""
        );


    texto =
        texto.replace(
            /^eu sou\s+/,
            ""
        );


    texto =
        texto.trim();


    /*
     * Se houver mais palavras,
     * pega o primeiro nome.
     */

    const partes =
        texto.split(/\s+/);


    return partes[0] ||
        "amigo";

}


/* =========================================================
   CONTINUAR PARA AJUDA
========================================================= */

function continuarDialogo() {

    body.className =
        "awake";


    setTimeout(
        () => {

            falar(

                "Como posso te ajudar? Posso dizer o dia, que horas são ou falar sobre o clima.",

                () => {

                    step =
                        "ajuda";

                }

            );

        },
        700
    );

}


/* =========================================================
   DATA / DIA
========================================================= */

function responderData() {

    const agora =
        new Date();


    const dias = [

        "domingo",
        "segunda-feira",
        "terça-feira",
        "quarta-feira",
        "quinta-feira",
        "sexta-feira",
        "sábado"

    ];


    const dia =
        dias[
            agora.getDay()
        ];


    const data =
        agora.toLocaleDateString(
            "pt-BR"
        );


    falar(

        `Hoje é ${dia}, dia ${data}. Quer ouvir uma piada?`,

        () => {

            step =
                "piada";

        }

    );

}


/* =========================================================
   HORA
========================================================= */

function responderHora() {

    const agora =
        new Date();


    const hora =
        agora.toLocaleTimeString(
            "pt-BR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    falar(

        `Agora são exatamente ${hora}. Quer ouvir uma piada?`,

        () => {

            step =
                "piada";

        }

    );

}


/* =========================================================
   CLIMA
========================================================= */

function responderClima() {

    /*
     * O robô não possui API de clima.
     */

    falar(

        "Ainda não fui treinado para isso, mas você quer ouvir uma piada?",

        () => {

            step =
                "piada";

        }

    );

}


/* =========================================================
   RAFAEL
========================================================= */

function processarRafael(
    fala
) {

    const texto =
        normalizar(
            fala
        );


    if (
        texto.includes(
            "professor"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Eai meu",

            continuarDialogo

        );


        return;

    }


    if (
        texto.includes(
            "coordenador"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Legal te conhecer",

            continuarDialogo

        );


        return;

    }


    if (
        texto.includes(
            "aluno"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Legal te conhecer",

            continuarDialogo

        );


        return;

    }


    body.className =
        "thinking";


    falar(

        "Você é aluno, professor ou coordenador?",

        () => {

            step =
                "rafael";

        }

    );

}


/* =========================================================
   PIADA
========================================================= */

function contarPiada() {

    body.className =
        "awake";


    falar(

        "Sabe por que o robô foi ao médico? Porque ele estava com um vírus! Rá! Rá! Rá! Rá!",

        () => {

            body.className =
                "laughing";


            setTimeout(
                () => {

                    body.className =
                        "awake";


                    falar(

                        "O papo está bom, mas minha bateria está acabando, então vou indo, tchau tchau!",

                        () => {

                            body.className =
                                "sleeping";


                            robotAwake =
                                false;


                            recognitionActive =
                                false;


                            if (
                                recognition
                            ) {

                                try {

                                    recognition.stop();

                                }
                                catch (e) {}

                            }

                        }

                    );

                },
                2200
            );

        }

    );

}


/* =========================================================
   PISCAR
========================================================= */

setInterval(
    () => {

        if (
            !body.classList.contains(
                "sleeping"
            )
        ) {

            body.classList.add(
                "blink"
            );


            setTimeout(
                () => {

                    body.classList.remove(
                        "blink"
                    );

                },
                150
            );

        }

    },
    4000
);


/* =========================================================
   ACORDAR
========================================================= */

function acordarRobo() {

    if (
        robotAwake
    ) {

        return;

    }


    robotAwake =
        true;


    body.className =
        "awake";


    step =
        "nome";


    /*
     * Estas funções são chamadas
     * diretamente pela interação do usuário.
     */

    entrarFullscreen();

    manterTelaAcesa();


    /*
     * Primeiro começa a fala.
     *
     * O microfone será ligado
     * automaticamente depois.
     */

    setTimeout(
        () => {

            falar(

                "Olá! Eu sou o robozinho. Qual o seu nome?"

            );

        },
        100
    );

}


/* =========================================================
   PRIMEIRO TOQUE
========================================================= */

document.addEventListener(
    "pointerdown",
    event => {

        if (
            event.pointerType ===
                "touch" ||

            event.pointerType ===
                "mouse" ||

            event.pointerType ===
                "pen"
        ) {

            /*
             * Fullscreen precisa ocorrer
             * dentro da interação.
             */

            entrarFullscreen();

            manterTelaAcesa();

            acordarRobo();

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   RECONHECIMENTO
========================================================= */

if (recognition) {


    recognition.onstart =
        () => {

            recognitionStarting =
                false;

            recognitionActive =
                true;


            console.log(
                "🎤 OUVINDO..."
            );

        };


    recognition.onresult =
        event => {

            if (
                robotSpeaking
            ) {

                return;

            }


            const ultimo =
                event.results.length - 1;


            const fala =
                event.results[
                    ultimo
                ][0]
                    .transcript
                    .trim();


            console.log(
                "Pessoa disse:",
                fala
            );


            const texto =
                normalizar(
                    fala
                );


            /* =================================================
               NOME
            ================================================= */

            if (
                step === "nome"
            ) {


                /*
                 * EDICARMEN
                 */

                if (

                    texto.includes(
                        "edicarmen"
                    )

                    ||

                    texto.includes(
                        "edcarmen"
                    )

                ) {

                    body.className =
                        "happy";


                    falar(

                        "Busquei aqui no meu banco de dados e vi que Edcarmen é coordenadora da escola Amácio Mazzaroppi.",

                        continuarDialogo

                    );


                    return;

                }


                /*
                 * RAFAEL
                 */

                if (
                    texto.includes(
                        "rafael"
                    )
                ) {

                    body.className =
                        "thinking";


                    falar(

                        "Busquei aqui no meu banco de dados e vi que existe Rafael aluno, Rafael professor e Rafael coordenador. Qual você é?",

                        () => {

                            step =
                                "rafael";

                        }

                    );


                    return;

                }


                /*
                 * LARA
                 */

                if (
                    texto.includes(
                        "lara"
                    )
                ) {

                    body.className =
                        "happy";


                    falar(

                        "Hi Teacher, nice to meet you!",

                        continuarDialogo

                    );


                    return;

                }


                /*
                 * QUALQUER OUTRO NOME
                 */

                const nome =
                    extrairNome(
                        fala
                    );


                body.className =
                    "happy";


                falar(

                    `Legal te conhecer, ${nome}! Eu sou um protótipo de um projeto educacional.`,

                    continuarDialogo

                );


                return;

            }


            /* =================================================
               RAFAEL
            ================================================= */

            if (
                step === "rafael"
            ) {

                processarRafael(
                    fala
                );


                return;

            }


            /* =================================================
               AJUDA
            ================================================= */

            if (
                step === "ajuda"
            ) {


                /*
                 * DIA / DATA
                 */

                if (

                    texto.includes(
                        "dia"
                    )

                    ||

                    texto.includes(
                        "data"
                    )

                    ||

                    texto.includes(
                        "hoje"
                    )

                ) {

                    responderData();

                    return;

                }


                /*
                 * HORA
                 */

                if (

                    texto.includes(
                        "hora"
                    )

                    ||

                    texto.includes(
                        "horas"
                    )

                ) {

                    responderHora();

                    return;

                }


                /*
                 * CLIMA
                 */

                if (

                    texto.includes(
                        "clima"
                    )

                    ||

                    texto.includes(
                        "tempo"
                    )

                    ||

                    texto.includes(
                        "chuva"
                    )

                    ||

                    texto.includes(
                        "temperatura"
                    )

                ) {

                    responderClima();

                    return;

                }


                /*
                 * NÃO SABE
                 */

                falar(

                    "Ainda não fui treinado para isso, mas você quer ouvir uma piada?",

                    () => {

                        step =
                            "piada";

                    }

                );


                return;

            }


            /* =================================================
               PIADA
            ================================================= */

            if (
                step === "piada"
            ) {


                /*
                 * SIM
                 */

                if (

                    texto.includes(
                        "sim"
                    )

                    ||

                    texto.includes(
                        "quero"
                    )

                    ||

                    texto.includes(
                        "pode"
                    )

                    ||

                    texto.includes(
                        "claro"
                    )

                    ||

                    texto.includes(
                        "manda"
                    )

                ) {

                    contarPiada();

                    return;

                }


                /*
                 * NÃO
                 *
                 * MESMO ASSIM CONTA.
                 */

                if (

                    texto.includes(
                        "nao"
                    )

                    ||

                    texto.includes(
                        "não"
                    )

                    ||

                    texto.includes(
                        "n"
                    )

                ) {

                    falar(

                        "Vou contar mesmo assim.",

                        () => {

                            contarPiada();

                        }

                    );


                    return;

                }


                /*
                 * Qualquer outra resposta
                 */

                falar(

                    "Vou contar mesmo assim.",

                    () => {

                        contarPiada();

                    }

                );

            }

        };


    /* =========================================================
       FIM DE UMA ESCUTA
    ========================================================= */

    recognition.onend =
        () => {

            recognitionActive =
                false;

            recognitionStarting =
                false;


            /*
             * Só volta a ouvir se:
             *
             * 1. robô está acordado
             * 2. não está falando
             */

            if (

                robotAwake &&

                !robotSpeaking

            ) {

                setTimeout(
                    () => {

                        iniciarMicrofone();

                    },
                    700
                );

            }

        };


    /* =========================================================
       ERROS
    ========================================================= */

    recognition.onerror =
        event => {

            recognitionActive =
                false;

            recognitionStarting =
                false;


            console.log(
                "Reconhecimento:",
                event.error
            );


            /*
             * Erros temporários:
             * tenta novamente.
             */

            if (

                robotAwake &&

                !robotSpeaking &&

                event.error !==
                    "not-allowed" &&

                event.error !==
                    "service-not-allowed"

            ) {

                setTimeout(
                    () => {

                        iniciarMicrofone();

                    },
                    1200
                );

            }

        };

}


/* =========================================================
   IMPEDIR ZOOM
========================================================= */

document.addEventListener(
    "gesturestart",
    e => {

        e.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturechange",
    e => {

        e.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gestureend",
    e => {

        e.preventDefault();

    },
    {
        passive: false
    }
);

</script>

</body>
</html>
