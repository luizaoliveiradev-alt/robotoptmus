<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#050505">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>Robô Interativo</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #050505;

    overflow: hidden;

    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;

    overscroll-behavior: none;
}

body {

    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 100dvh;

    cursor: pointer;
}


/* =========================================================
   ORIENTAÇÃO
========================================================= */

#orientation-overlay {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: #fff;

    z-index: 999999;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    font-family: Arial, sans-serif;
}

#orientation-overlay div {

    font-size: 55px;

    margin-bottom: 15px;
}

#orientation-overlay p {

    margin: 0;

    font-size: 18px;
}

@media (orientation: portrait) {

    #orientation-overlay {

        display: flex;

    }
}


/* =========================================================
   ROSTO
========================================================= */

.face-container {

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    animation:
        flutuar 5s ease-in-out infinite;
}

@keyframes flutuar {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-12px);
    }
}


/* =========================================================
   OLHOS
========================================================= */

.eyes-row {

    width: 100vw;

    display: flex;

    align-items: center;
    justify-content: center;

    gap:
        clamp(60px, 11vw, 160px);
}


.eye {

    width:
        clamp(170px, 22vw, 330px);

    height:
        clamp(150px, 20vw, 290px);

    background:
        #f0faff;

    border-radius: 80px;

    box-shadow:

        0 0 30px
        rgba(240,250,255,.15),

        0 0 70px
        rgba(240,250,255,.07);

    transition:

        all .4s
        cubic-bezier(
            .175,
            .885,
            .32,
            1.275
        );
}


/* =========================================================
   DORMINDO
========================================================= */

.sleeping .eye {

    width:
        clamp(140px,18vw,260px);

    height: 8px;

    opacity: .2;

    border-radius: 4px;
}


/* =========================================================
   FELIZ
========================================================= */

.happy .eye {

    height:
        clamp(70px,10vw,130px);

    background: transparent;

    border-top:
        clamp(18px,2.5vw,30px)
        solid
        #f0faff;

    border-radius:
        100px 100px 0 0;

    box-shadow: none;

    transform:
        translateY(25px);
}


/* =========================================================
   PENSANDO
========================================================= */

.thinking #eye-l {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(150px,20vw,290px);
}


.thinking #eye-r {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(100px,15vw,210px);
}


/* =========================================================
   RINDO
========================================================= */

.laughing .eye {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(40px,6vw,75px);

    transform:
        skewX(10deg);
}


/* =========================================================
   PISCADA
========================================================= */

.blink .eye {

    transform:
        scaleY(0) !important;
}


/* =========================================================
   CELULAR DEITADO
========================================================= */

@media (max-height:500px)
and (orientation:landscape) {

    .eye {

        width: 20vw;

        height: 17vw;

        max-width: 300px;

        max-height: 240px;
    }

    .eyes-row {

        gap: 10vw;
    }
}

</style>

</head>


<body class="sleeping">


<!-- =======================================================
     ORIENTAÇÃO
======================================================= -->

<div id="orientation-overlay">

    <div>📱🔄</div>

    <p>
        Gire o dispositivo para deitado.
    </p>

</div>


<!-- =======================================================
     ROSTO
======================================================= -->

<div class="face-container">

    <div class="eyes-row">

        <div
            id="eye-l"
            class="eye">
        </div>

        <div
            id="eye-r"
            class="eye">
        </div>

    </div>

</div>


<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

const body =
    document.body;


let recognition =
    null;


let recognitionActive =
    false;


let recognitionStarting =
    false;


let robotSpeaking =
    false;


let robotAwake =
    false;


let step =
    "nome";


let wakeLock =
    null;


let voices =
    [];


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "pt-BR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;

}


/* =========================================================
   VOZES
========================================================= */

function carregarVozes() {

    voices =
        window.speechSynthesis
            .getVoices();

}


carregarVozes();


if (
    "onvoiceschanged"
    in window.speechSynthesis
) {

    window.speechSynthesis
        .onvoiceschanged =
        carregarVozes;
}


/* =========================================================
   ESCOLHER VOZ
========================================================= */

function escolherVoz() {

    carregarVozes();

    /*
     * Tenta encontrar uma voz
     * portuguesa/brasileira.
     */

    let voz =
        voices.find(
            v =>
                v.lang &&
                v.lang
                    .toLowerCase()
                    .includes("pt-br")
        );


    if (!voz) {

        voz =
            voices.find(
                v =>
                    v.lang &&
                    v.lang
                        .toLowerCase()
                        .startsWith("pt")
            );

    }


    return voz || null;
}


/* =========================================================
   FULLSCREEN
========================================================= */

function entrarFullscreen() {

    /*
     * IMPORTANTE:
     *
     * Esta função NÃO é async.
     *
     * Ela precisa ser chamada
     * diretamente dentro do toque.
     */

    try {

        if (
            document.fullscreenElement
        ) {

            return;
        }


        const elemento =
            document.documentElement;


        if (
            elemento.requestFullscreen
        ) {

            elemento.requestFullscreen()
                .then(() => {

                    console.log(
                        "FULLSCREEN ATIVADO"
                    );

                })
                .catch(erro => {

                    console.log(
                        "Fullscreen recusado:",
                        erro
                    );

                });

            return;
        }


        /*
         * Compatibilidade WebKit.
         */

        if (
            elemento.webkitRequestFullscreen
        ) {

            elemento.webkitRequestFullscreen();

        }

    }
    catch (erro) {

        console.log(
            "Fullscreen:",
            erro
        );

    }

}


/* =========================================================
   WAKE LOCK
========================================================= */

function manterTelaAcesa() {

    if (
        !("wakeLock" in navigator)
    ) {

        console.log(
            "Wake Lock não disponível."
        );

        return;
    }


    if (
        wakeLock &&
        !wakeLock.released
    ) {

        return;
    }


    navigator.wakeLock
        .request("screen")

        .then(lock => {

            wakeLock =
                lock;

            console.log(
                "TELA MANTIDA ACESA"
            );

        })

        .catch(erro => {

            console.log(
                "Wake Lock:",
                erro
            );

        });
}


/* =========================================================
   RECUPERAR WAKE LOCK
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            manterTelaAcesa();

        }

    }
);


/* =========================================================
   INICIAR MICROFONE
========================================================= */

function iniciarMicrofone() {

    if (!recognition) {

        alert(
            "Este navegador não suporta reconhecimento de voz."
        );

        return;

    }


    if (
        recognitionActive ||
        recognitionStarting
    ) {

        return;

    }


    recognitionStarting =
        true;


    try {

        recognition.start();

    }

    catch (erro) {

        recognitionStarting =
            false;

        console.log(
            "Erro ao iniciar microfone:",
            erro
        );

    }

}


/* =========================================================
   PARAR MICROFONE
========================================================= */

function pararMicrofone() {

    if (!recognition) {

        return;
    }


    try {

        recognition.stop();

    }

    catch (e) {}

}


/* =========================================================
   FALAR
========================================================= */

function falar(
    texto,
    callback
) {

    robotSpeaking =
        true;


    /*
     * Para o microfone ANTES
     * do robô começar a falar.
     */

    pararMicrofone();


    /*
     * Cancela fala anterior.
     */

    window.speechSynthesis.cancel();


    const mensagem =
        new SpeechSynthesisUtterance(
            texto
        );


    mensagem.lang =
        "pt-BR";


    /*
     * Voz mais grave,
     * mas sem ficar monstruosa.
     */

    mensagem.pitch =
        0.75;


    mensagem.rate =
        0.90;


    mensagem.volume =
        1;


    const voz =
        escolherVoz();


    if (voz) {

        mensagem.voice =
            voz;

    }


    mensagem.onstart =
        () => {

            robotSpeaking =
                true;

        };


    mensagem.onend =
        () => {

            robotSpeaking =
                false;


            /*
             * Só volta a ouvir
             * DEPOIS que terminar.
             */

            if (
                robotAwake
            ) {

                setTimeout(
                    () => {

                        iniciarMicrofone();

                    },
                    500
                );

            }


            if (callback) {

                callback();

            }

        };


    mensagem.onerror =
        () => {

            robotSpeaking =
                false;

        };


    window.speechSynthesis
        .speak(
            mensagem
        );

}


/* =========================================================
   NORMALIZAR
========================================================= */

function normalizar(texto) {

    return texto

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[.,!?;:]/g,
            ""
        )

        .trim();

}


/* =========================================================
   EXTRAIR NOME
========================================================= */

function extrairNome(fala) {

    let texto =
        normalizar(fala);


    texto =
        texto.replace(
            /^meu nome e\s+/,
            ""
        );


    texto =
        texto.replace(
            /^eu sou\s+/,
            ""
        );


    texto =
        texto.trim();


    const partes =
        texto.split(/\s+/);


    return partes[0] || "amigo";

}


/* =========================================================
   CONTINUAR
========================================================= */

function continuarDialogo() {

    body.className =
        "awake";


    setTimeout(
        () => {

            falar(

                "Legal te conhecer! Eu sou um protótipo de um projeto educacional. Quer ouvir uma piada?",

                () => {

                    step =
                        "piada";

                }

            );

        },
        400
    );

}


/* =========================================================
   RAFAEL
========================================================= */

function processarRafael(
    fala
) {

    const texto =
        normalizar(fala);


    if (
        texto.includes(
            "professor"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Eaí meu, legal te conhecer!",

            continuarDialogo

        );


        return;
    }


    if (
        texto.includes(
            "coordenador"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Legal te conhecer!",

            continuarDialogo

        );


        return;
    }


    if (
        texto.includes(
            "aluno"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Legal te conhecer!",

            continuarDialogo

        );


        return;
    }


    body.className =
        "thinking";


    falar(

        "Não entendi. Você é aluno, professor ou coordenador?",

        () => {

            step =
                "rafael";

        }

    );

}


/* =========================================================
   PIADA
========================================================= */

function contarPiada() {

    body.className =
        "awake";


    falar(

        "Sabe por que o robô foi ao médico? Porque ele estava com um vírus! Rá! Rá! Rá! Rá!",

        () => {

            body.className =
                "laughing";


            setTimeout(
                () => {

                    body.className =
                        "awake";


                    falar(

                        "O papo está bom, mas minha bateria está acabando, então vou indo, tchau tchau!",

                        () => {

                            body.className =
                                "sleeping";


                            robotAwake =
                                false;


                            recognitionActive =
                                false;


                            pararMicrofone();

                        }

                    );

                },
                2000
            );

        }

    );

}


/* =========================================================
   PISCAR
========================================================= */

setInterval(
    () => {

        if (
            !body.classList.contains(
                "sleeping"
            )
        ) {

            body.classList.add(
                "blink"
            );


            setTimeout(
                () => {

                    body.classList.remove(
                        "blink"
                    );

                },
                150
            );

        }

    },
    4000
);


/* =========================================================
   ACORDAR
========================================================= */

function acordarRobo() {

    /*
     * Evita múltiplas ativações.
     */

    if (robotAwake) {

        return;

    }


    robotAwake =
        true;


    body.className =
        "awake";


    step =
        "nome";


    /*
     * =====================================================
     * ESSAS DUAS CHAMADAS ACONTECEM DIRETAMENTE
     * NO TOQUE DO USUÁRIO.
     * =====================================================
     */

    entrarFullscreen();

    manterTelaAcesa();


    /*
     * =====================================================
     * MICROFONE TAMBÉM É INICIADO DIRETAMENTE
     * NO TOQUE.
     *
     * ISSO É O QUE ESTAVA FALTANDO.
     * =====================================================
     */

    if (recognition) {

        iniciarMicrofone();

    }


    /*
     * Depois fala.
     *
     * O falar() para o microfone enquanto
     * a voz estiver falando.
     *
     * Quando terminar, ele volta a ouvir.
     */

    setTimeout(
        () => {

            falar(
                "Olá! Eu sou o robozinho. Qual o seu nome?"
            );

        },
        150
    );

}


/* =========================================================
   PRIMEIRO TOQUE
========================================================= */

/*
 * SOMENTE UM EVENTO.
 *
 * Nada de click + touchend.
 */

document.addEventListener(

    "pointerdown",

    event => {

        if (
            event.pointerType ===
                "touch" ||

            event.pointerType ===
                "mouse" ||

            event.pointerType ===
                "pen"
        ) {

            acordarRobo();

        }

    },

    {
        passive: true
    }

);


/* =========================================================
   RECONHECIMENTO
========================================================= */

if (recognition) {


    recognition.onstart =
        () => {

            recognitionStarting =
                false;

            recognitionActive =
                true;


            console.log(
                "🎤 MICROFONE ATIVO"
            );

        };


    recognition.onresult =
        event => {

            /*
             * Nunca processa a fala
             * do robô.
             */

            if (
                robotSpeaking
            ) {

                return;

            }


            const ultimo =
                event.results.length - 1;


            const fala =
                event.results[
                    ultimo
                ][0]
                    .transcript
                    .trim();


            console.log(
                "Usuário:",
                fala
            );


            const texto =
                normalizar(
                    fala
                );


            /* =================================================
               NOME
            ================================================= */

            if (
                step === "nome"
            ) {


                /* EDCARMEN */

                if (

                    texto.includes(
                        "edicarmen"
                    )

                    ||

                    texto.includes(
                        "edcarmen"
                    )

                ) {

                    body.className =
                        "happy";


                    falar(

                        "Busquei aqui no meu banco de dados e vi que Edcarmen é coordenadora da escola Amácio Mazzaroppi.",

                        continuarDialogo

                    );


                    return;

                }


                /* RAFAEL */

                if (
                    texto.includes(
                        "rafael"
                    )
                ) {

                    body.className =
                        "thinking";


                    falar(

                        "Busquei aqui no meu banco de dados e vi que existe Rafael aluno, Rafael professor e Rafael coordenador. Qual você é?",

                        () => {

                            step =
                                "rafael";

                        }

                    );


                    return;

                }


                /* LARA */

                if (
                    texto.includes(
                        "lara"
                    )
                ) {

                    body.className =
                        "happy";


                    falar(

                        "Hi Teacher, nice to meet you!",

                        continuarDialogo

                    );


                    return;

                }


                /* OUTRO NOME */

                const nome =
                    extrairNome(
                        fala
                    );


                body.className =
                    "happy";


                falar(

                    `Legal te conhecer, ${nome}! Eu sou um protótipo de um projeto educacional.`,

                    () => {

                        setTimeout(
                            () => {

                                falar(

                                    "Quer ouvir uma piada?",

                                    () => {

                                        step =
                                            "piada";

                                    }

                                );

                            },
                            400
                        );

                    }

                );


                return;

            }


            /* =================================================
               RAFAEL
            ================================================= */

            if (
                step === "rafael"
            ) {

                processarRafael(
                    fala
                );


                return;

            }


            /* =================================================
               PIADA
            ================================================= */

            if (
                step === "piada"
            ) {


                if (

                    texto.includes(
                        "sim"
                    )

                    ||

                    texto.includes(
                        "quero"
                    )

                    ||

                    texto.includes(
                        "pode"
                    )

                    ||

                    texto.includes(
                        "claro"
                    )

                ) {

                    contarPiada();

                    return;

                }


                if (

                    texto.includes(
                        "nao"
                    )

                    ||

                    texto.includes(
                        "não"
                    )

                ) {

                    falar(

                        "Vou contar mesmo assim!",

                        () => {

                            contarPiada();

                        }

                    );


                    return;

                }


                falar(

                    "Vou contar mesmo assim!",

                    () => {

                        contarPiada();

                    }

                );

            }

        };


    /* =========================================================
       MICROFONE TERMINOU
    ========================================================= */

    recognition.onend =
        () => {

            recognitionActive =
                false;


            recognitionStarting =
                false;


            /*
             * Se o robô está acordado
             * e não está falando,
             * volta a ouvir.
             */

            if (

                robotAwake &&

                !robotSpeaking

            ) {

                setTimeout(
                    () => {

                        iniciarMicrofone();

                    },
                    500
                );

            }

        };


    /* =========================================================
       ERRO
    ========================================================= */

    recognition.onerror =
        event => {

            recognitionActive =
                false;

            recognitionStarting =
                false;


            console.log(
                "🎤 Erro:",
                event.error
            );


            /*
             * Se for erro temporário,
             * tenta novamente.
             */

            if (

                robotAwake &&

                event.error !==
                    "not-allowed" &&

                event.error !==
                    "service-not-allowed"

            ) {

                setTimeout(
                    () => {

                        if (
                            !robotSpeaking
                        ) {

                            iniciarMicrofone();

                        }

                    },
                    1000
                );

            }

        };

}


/* =========================================================
   DESABILITAR ZOOM
========================================================= */

document.addEventListener(
    "gesturestart",
    e => e.preventDefault(),
    {
        passive: false
    }
);

document.addEventListener(
    "gesturechange",
    e => e.preventDefault(),
    {
        passive: false
    }
);

document.addEventListener(
    "gestureend",
    e => e.preventDefault(),
    {
        passive: false
    }
);

</script>

</body>
</html>
