<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#050505">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Robô Interativo</title>


    <style>

        /* =====================================================
           CONFIGURAÇÕES GERAIS
        ===================================================== */

        :root {

            --eye-white: #f0faff;

            --dark-bg: #050505;

            --glow-soft:
                rgba(240, 250, 255, 0.15);

        }


        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            background:
                var(--dark-bg);

            overflow: hidden;

            touch-action: manipulation;

            overscroll-behavior: none;

            user-select: none;

            -webkit-user-select: none;

        }


        body {

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100dvh;

            cursor: pointer;

        }


        /* =====================================================
           ORIENTAÇÃO
        ===================================================== */

        #orientation-overlay {

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100%;

            background: #000;

            color: white;

            z-index: 99999;

            display: none;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            font-family: Arial, sans-serif;

        }


        #orientation-overlay div {

            font-size: 50px;

        }


        #orientation-overlay p {

            font-size: 18px;

        }


        @media (orientation: portrait) {

            #orientation-overlay {

                display: flex;

            }

        }


        /* =====================================================
           ROSTO
        ===================================================== */

        .face-container {

            display: flex;

            justify-content: center;

            align-items: center;

            width: 100vw;

            height: 100vh;

            animation:
                float 5s ease-in-out infinite;

        }


        @keyframes float {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-12px);

            }

        }


        /* =====================================================
           OLHOS
        ===================================================== */

        .eyes-row {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100vw;

            gap:
                clamp(60px, 11vw, 160px);

        }


        .eye {

            width:
                clamp(170px, 22vw, 330px);

            height:
                clamp(150px, 20vw, 290px);

            background:
                var(--eye-white);

            border-radius: 80px;

            box-shadow:

                0 0 30px
                var(--glow-soft),

                0 0 70px
                rgba(240,250,255,0.07);

            transition:

                all .4s
                cubic-bezier(
                    .175,
                    .885,
                    .32,
                    1.275
                );

        }


        /* =====================================================
           DORMINDO
        ===================================================== */

        .sleeping .eye {

            width:
                clamp(140px, 18vw, 260px);

            height: 8px;

            opacity: .2;

            border-radius: 4px;

        }


        /* =====================================================
           FELIZ
        ===================================================== */

        .happy .eye {

            height:
                clamp(70px, 10vw, 130px);

            background: transparent;

            border-top:

                clamp(18px, 2.5vw, 30px)

                solid
                var(--eye-white);

            border-radius:
                100px 100px 0 0;

            box-shadow: none;

            transform:
                translateY(25px);

        }


        /* =====================================================
           PENSANDO
        ===================================================== */

        .thinking #eye-l {

            width:
                clamp(170px, 22vw, 330px);

            height:
                clamp(150px, 20vw, 290px);

        }


        .thinking #eye-r {

            width:
                clamp(170px, 22vw, 330px);

            height:
                clamp(100px, 15vw, 210px);

        }


        /* =====================================================
           RINDO
        ===================================================== */

        .laughing .eye {

            width:
                clamp(170px, 22vw, 330px);

            height:
                clamp(40px, 6vw, 75px);

            transform:
                skewX(10deg);

        }


        /* =====================================================
           PISCADA
        ===================================================== */

        .blink .eye {

            transform:
                scaleY(0) !important;

        }


        /* =====================================================
           TELAS PEQUENAS
        ===================================================== */

        @media (max-height: 500px)
        and (orientation: landscape) {

            .eye {

                width: 20vw;

                height: 17vw;

                max-width: 270px;

                max-height: 225px;

            }


            .eyes-row {

                gap: 10vw;

            }

        }

    </style>

</head>


<body class="sleeping">


    <!-- =====================================================
         AVISO PARA GIRAR O CELULAR
    ===================================================== -->

    <div id="orientation-overlay">

        <div>📱🔄</div>

        <p>
            Gire o dispositivo para deitado.
        </p>

    </div>


    <!-- =====================================================
         OLHOS
    ===================================================== -->

    <div class="face-container">

        <div class="eyes-row">

            <div
                id="eye-l"
                class="eye">
            </div>

            <div
                id="eye-r"
                class="eye">
            </div>

        </div>

    </div>


<script>


/* ============================================================
   VARIÁVEIS
============================================================ */

const body =
    document.body;


let recognitionActive =
    false;


let robotSpeaking =
    false;


let step =
    "nome";


let userName =
    "";


let wakeLock =
    null;


let voices =
    [];


/* ============================================================
   RECONHECIMENTO DE VOZ
============================================================ */

const SpeechRecognition =

    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const recognition =

    SpeechRecognition
        ? new SpeechRecognition()
        : null;


if (recognition) {

    recognition.lang =
        "pt-BR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;

}


/* ============================================================
   CARREGAR VOZES
============================================================ */

function carregarVozes() {

    voices =
        window.speechSynthesis
            .getVoices();

}


carregarVozes();


if (
    "onvoiceschanged"
    in window.speechSynthesis
) {

    window.speechSynthesis
        .onvoiceschanged =
        carregarVozes;

}


/* ============================================================
   ENCONTRAR VOZ MASCULINA
============================================================ */

function encontrarVozMasculina() {

    carregarVozes();


    const nomes = [

        "daniel",
        "felipe",
        "ricardo",
        "lucas",
        "jorge",
        "male",
        "masculina",
        "homem"

    ];


    /*
     * Primeiro tenta encontrar
     * especificamente uma voz
     * masculina em português.
     */

    let voz =

        voices.find(voice => {

            const nome =
                voice.name
                    .toLowerCase();

            const idioma =
                voice.lang
                    .toLowerCase();

            return (

                idioma.includes(
                    "pt-br"
                ) &&

                nomes.some(
                    termo =>
                        nome.includes(
                            termo
                        )
                )

            );

        });


    /*
     * Se não encontrar,
     * usa uma voz brasileira.
     */

    if (!voz) {

        voz =

            voices.find(voice =>

                voice.lang
                    .toLowerCase()
                    .includes("pt-br")

            );

    }


    return voz || null;

}


/* ============================================================
   TELA SEMPRE ACESA
============================================================ */

async function manterTelaAcesa() {

    try {

        if (
            "wakeLock"
            in navigator
        ) {

            if (
                wakeLock &&
                !wakeLock.released
            ) {

                return;

            }


            wakeLock =

                await navigator
                    .wakeLock
                    .request(
                        "screen"
                    );


            console.log(
                "Tela mantida acesa."
            );

        }

    }

    catch (erro) {

        console.log(
            "Wake Lock não disponível:",
            erro
        );

    }

}


/*
 * Se o navegador voltar
 * para a página, solicita
 * novamente o Wake Lock.
 */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState
            === "visible"
        ) {

            manterTelaAcesa();

        }

    }
);


/* ============================================================
   FALA DO ROBÔ
============================================================ */

function falar(
    texto,
    callback
) {

    robotSpeaking =
        true;


    /*
     * Para o microfone
     * enquanto o robô fala.
     */

    if (
        recognition &&
        recognitionActive
    ) {

        try {

            recognition.stop();

        }

        catch (e) {}

    }


    /*
     * Cancela qualquer fala
     * anterior.
     */

    window.speechSynthesis
        .cancel();


    const msg =

        new SpeechSynthesisUtterance(
            texto
        );


    msg.lang =
        "pt-BR";


    /*
     * ========================================================
     * VOZ ROBÓTICA
     * ========================================================
     *
     * Pitch muito baixo = voz grave.
     *
     * Rate menor = fala mais pesada.
     */

    msg.pitch =
        0.20;


    msg.rate =
        0.78;


    msg.volume =
        1;


    const voz =
        encontrarVozMasculina();


    if (voz) {

        msg.voice =
            voz;

    }


    msg.onstart = () => {

        robotSpeaking =
            true;

    };


    msg.onend = () => {

        robotSpeaking =
            false;


        /*
         * Dá um pequeno intervalo
         * antes de religar o microfone.
         */

        setTimeout(() => {

            if (
                recognition &&
                recognitionActive
            ) {

                try {

                    recognition.start();

                }

                catch (e) {}

            }

        }, 500);


        if (callback) {

            callback();

        }

    };


    msg.onerror = () => {

        robotSpeaking =
            false;

    };


    window.speechSynthesis
        .speak(msg);

}


/* ============================================================
   NORMALIZAR TEXTO
============================================================ */

function normalizar(texto) {

    return texto

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[.,!?;:]/g,
            ""
        )

        .trim();

}


/* ============================================================
   EXTRAIR NOME
============================================================ */

function extrairNome(fala) {

    let texto =
        normalizar(fala);


    /*
     * Remove:
     *
     * meu nome é
     * meu nome e
     * eu sou
     */

    texto =

        texto.replace(
            /^meu nome e\s+/,
            ""
        );


    texto =

        texto.replace(
            /^eu sou\s+/,
            ""
        );


    texto =
        texto.trim();


    /*
     * Pega o primeiro nome.
     */

    const partes =
        texto.split(/\s+/);


    return partes[0] || "";

}


/* ============================================================
   INICIAR CONTINUAÇÃO DO DIÁLOGO
============================================================ */

function continuarDialogo() {

    step =
        "continuacao";


    body.className =
        "awake";


    /*
     * Agora o robô já identificou
     * a pessoa e pergunta se ela
     * quer ouvir uma piada.
     */

    falar(

        "Legal! Eu estou aqui como um protótipo de um projeto educacional. Posso te contar uma piada?",

        () => {

            step =
                "decisao_piada";

        }

    );

}


/* ============================================================
   RAFAEL — IDENTIFICAÇÃO
============================================================ */

function processarRafael(
    fala
) {

    const texto =
        normalizar(fala);


    /*
     * PROFESSOR
     */

    if (
        texto.includes(
            "professor"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Eaí meu, legal te conhecer!",

            continuarDialogo

        );


        return;

    }


    /*
     * COORDENADOR
     */

    if (
        texto.includes(
            "coordenador"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Legal te conhecer!",

            continuarDialogo

        );


        return;

    }


    /*
     * ALUNO
     */

    if (
        texto.includes(
            "aluno"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Legal te conhecer!",

            continuarDialogo

        );


        return;

    }


    /*
     * Se não entendeu.
     */

    body.className =
        "thinking";


    falar(

        "Não entendi. Você é aluno, professor ou coordenador?",

        () => {

            step =
                "rafael";

        }

    );

}


/* ============================================================
   PIADA
============================================================ */

function contarPiada() {

    body.className =
        "awake";


    /*
     * PIADA
     */

    falar(

        "Sabe por que o robô foi ao médico? Porque ele estava com um vírus! Rá! Rá! Rá! Rá!",

        () => {


            /*
             * EXPRESSÃO DE RISO
             */

            body.className =
                "laughing";


            setTimeout(() => {


                body.className =
                    "awake";


                falar(

                    "O papo está bom, mas minha bateria está acabando, então vou indo. Tchau tchau!",

                    () => {


                        /*
                         * VOLTA A DORMIR
                         */

                        body.className =
                            "sleeping";


                        recognitionActive =
                            false;


                        if (recognition) {

                            try {

                                recognition.stop();

                            }

                            catch (e) {}

                        }

                    }

                );


            }, 2000);

        }

    );

}


/* ============================================================
   PISCADA AUTOMÁTICA
============================================================ */

setInterval(() => {

    if (
        !body.classList
            .contains("sleeping")
    ) {

        body.classList
            .add("blink");


        setTimeout(() => {

            body.classList
                .remove("blink");

        }, 150);

    }

}, 4000);


/* ============================================================
   ACORDAR ROBÔ
============================================================ */

function acordarRobo() {

    /*
     * Tenta manter a tela ligada.
     */

    manterTelaAcesa();


    if (
        !recognitionActive &&
        recognition
    ) {

        body.className =
            "awake";


        recognitionActive =
            true;


        step =
            "nome";


        try {

            recognition.start();


            falar(

                "Olá! Eu sou o robozinho. Qual o seu nome?"

            );

        }

        catch (erro) {

            console.log(
                "Erro:",
                erro
            );


            recognitionActive =
                false;

        }

    }

}


/* ============================================================
   PRIMEIRO TOQUE
============================================================ */

window.addEventListener(
    "click",
    acordarRobo
);


/* ============================================================
   RECONHECIMENTO DE VOZ
============================================================ */

if (recognition) {


    recognition.onresult =
        event => {


            /*
             * Ignora qualquer coisa
             * enquanto o robô fala.
             */

            if (robotSpeaking) {

                return;

            }


            const ultimo =
                event.results.length - 1;


            const fala =

                event.results[
                    ultimo
                ][0]
                    .transcript
                    .toLowerCase()
                    .trim();


            console.log(
                "Pessoa disse:",
                fala
            );


            const texto =
                normalizar(fala);


            /* =================================================
               ETAPA 1 — NOME
            ================================================= */

            if (
                step === "nome"
            ) {


                /*
                 * ==============================================
                 * EDICARMEN / EDCARMEN
                 * ==============================================
                 */

                if (

                    texto.includes(
                        "edicarmen"
                    )

                    ||

                    texto.includes(
                        "edcarmen"
                    )

                ) {

                    userName =
                        "Edcarmen";


                    body.className =
                        "happy";


                    falar(

                        "Busquei aqui no meu banco de dados e vi que Edcarmen é coordenadora da escola Amácio Mazzaroppi.",

                        continuarDialogo

                    );


                    return;

                }


                /*
                 * ==============================================
                 * RAFAEL
                 * ==============================================
                 */

                if (
                    texto.includes(
                        "rafael"
                    )
                ) {

                    userName =
                        "Rafael";


                    body.className =
                        "thinking";


                    falar(

                        "Busquei aqui no meu banco de dados e vi que existe Rafael aluno, Rafael professor e Rafael coordenador. Qual você é?",

                        () => {

                            step =
                                "rafael";

                        }

                    );


                    return;

                }


                /*
                 * ==============================================
                 * LARA
                 * ==============================================
                 */

                if (
                    texto.includes(
                        "lara"
                    )
                ) {

                    userName =
                        "Lara";


                    body.className =
                        "happy";


                    falar(

                        "Hi Teacher, nice to meet you!",

                        continuarDialogo

                    );


                    return;

                }


                /*
                 * ==============================================
                 * QUALQUER OUTRO NOME
                 * ==============================================
                 */

                userName =
                    extrairNome(
                        fala
                    );


                if (!userName) {

                    userName =
                        "amigo";

                }


                body.className =
                    "happy";


                falar(

                    `Legal te conhecer, ${userName}! Eu sou um protótipo de um projeto educacional.`,

                    () => {

                        /*
                         * Depois do nome,
                         * pergunta sobre a piada.
                         */

                        falar(

                            "Posso te contar uma piada?",

                            () => {

                                step =
                                    "decisao_piada";

                            }

                        );

                    }

                );


                return;

            }


            /* =================================================
               ETAPA 2 — RAFAEL
            ================================================= */

            if (
                step === "rafael"
            ) {

                processarRafael(
                    fala
                );

                return;

            }


            /* =================================================
               ETAPA 3 — DECISÃO DA PIADA
            ================================================= */

            if (
                step === "decisao_piada"
            ) {


                /*
                 * SIM
                 */

                if (

                    texto.includes(
                        "sim"
                    )

                    ||

                    texto.includes(
                        "quero"
                    )

                    ||

                    texto.includes(
                        "pode"
                    )

                    ||

                    texto.includes(
                        "claro"
                    )

                ) {

                    contarPiada();

                    return;

                }


                /*
                 * NÃO
                 */

                if (

                    texto.includes(
                        "nao"
                    )

                    ||

                    texto.includes(
                        "não"
                    )

                ) {

                    falar(

                        "Vou contar mesmo assim!",

                        () => {

                            contarPiada();

                        }

                    );


                    return;

                }


                /*
                 * Qualquer resposta
                 * diferente também
                 * leva para a piada.
                 */

                falar(

                    "Vou contar mesmo assim!",

                    () => {

                        contarPiada();

                    }

                );

            }

        };


    /* =========================================================
       FIM DO RECONHECIMENTO
    ========================================================= */

    recognition.onend =
        () => {

            if (
                recognitionActive &&
                !robotSpeaking
            ) {

                setTimeout(() => {

                    try {

                        recognition.start();

                    }

                    catch (e) {}

                }, 350);

            }

        };


    /* =========================================================
       ERROS
    ========================================================= */

    recognition.onerror =
        event => {

            console.log(
                "Reconhecimento:",
                event.error
            );

        };

}


/* ============================================================
   TELA CHEIA
============================================================ */

async function entrarTelaCheia() {

    try {

        if (

            document
                .documentElement
                .requestFullscreen

            &&

            !document.fullscreenElement

        ) {

            await document
                .documentElement
                .requestFullscreen();

        }

    }

    catch (e) {

        console.log(
            "Tela cheia não disponível."
        );

    }

}


/* ============================================================
   PRIMEIRO TOQUE:
   TELA CHEIA + WAKE LOCK
============================================================ */

window.addEventListener(

    "click",

    () => {

        manterTelaAcesa();

        entrarTelaCheia();

    },

    {
        once: true
    }

);


/* ============================================================
   BLOQUEAR ZOOM
============================================================ */

document.addEventListener(
    "gesturestart",
    e => e.preventDefault()
);

document.addEventListener(
    "gesturechange",
    e => e.preventDefault()
);

document.addEventListener(
    "gestureend",
    e => e.preventDefault()
);


</script>

</body>

</html>
