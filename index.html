<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#050505">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>Robô Interativo</title>

<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #050505;

    overflow: hidden;

    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;

    overscroll-behavior: none;
}

body {

    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 100dvh;

    cursor: pointer;
}


/* =========================================================
   ORIENTAÇÃO
========================================================= */

#orientation-overlay {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: white;

    z-index: 999999;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    font-family: Arial, sans-serif;
}

#orientation-overlay div {

    font-size: 50px;

    margin-bottom: 15px;
}

#orientation-overlay p {

    font-size: 18px;

    margin: 0;
}

@media (orientation: portrait) {

    #orientation-overlay {

        display: flex;

    }
}


/* =========================================================
   ROSTO
========================================================= */

.face-container {

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    animation:
        floating 5s ease-in-out infinite;
}

@keyframes floating {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-12px);
    }
}


/* =========================================================
   OLHOS
========================================================= */

.eyes-row {

    width: 100vw;

    display: flex;

    align-items: center;
    justify-content: center;

    gap:
        clamp(60px, 11vw, 160px);
}

.eye {

    width:
        clamp(170px, 22vw, 330px);

    height:
        clamp(150px, 20vw, 290px);

    background:
        #f0faff;

    border-radius: 80px;

    box-shadow:

        0 0 30px
        rgba(240,250,255,0.15),

        0 0 70px
        rgba(240,250,255,0.07);

    transition:

        all 0.4s
        cubic-bezier(
            0.175,
            0.885,
            0.32,
            1.275
        );
}


/* =========================================================
   DORMINDO
========================================================= */

.sleeping .eye {

    width:
        clamp(140px, 18vw, 260px);

    height: 8px;

    opacity: 0.2;

    border-radius: 4px;
}


/* =========================================================
   FELIZ
========================================================= */

.happy .eye {

    height:
        clamp(70px, 10vw, 130px);

    background: transparent;

    border-top:
        clamp(18px, 2.5vw, 30px)
        solid
        #f0faff;

    border-radius:
        100px 100px 0 0;

    box-shadow: none;

    transform:
        translateY(25px);
}


/* =========================================================
   PENSANDO
========================================================= */

.thinking #eye-l {

    width:
        clamp(170px, 22vw, 330px);

    height:
        clamp(150px, 20vw, 290px);
}

.thinking #eye-r {

    width:
        clamp(170px, 22vw, 330px);

    height:
        clamp(100px, 15vw, 210px);
}


/* =========================================================
   RINDO
========================================================= */

.laughing .eye {

    width:
        clamp(170px, 22vw, 330px);

    height:
        clamp(40px, 6vw, 75px);

    transform:
        skewX(10deg);
}


/* =========================================================
   PISCADA
========================================================= */

.blink .eye {

    transform:
        scaleY(0) !important;
}


/* =========================================================
   TELAS BAIXAS
========================================================= */

@media (max-height: 500px)
and (orientation: landscape) {

    .eye {

        width: 20vw;
        height: 17vw;

        max-width: 300px;
        max-height: 240px;
    }

    .eyes-row {

        gap: 10vw;
    }
}

</style>
</head>


<body class="sleeping">


<!-- =======================================================
     ORIENTAÇÃO
======================================================= -->

<div id="orientation-overlay">

    <div>📱🔄</div>

    <p>
        Gire o dispositivo para deitado.
    </p>

</div>


<!-- =======================================================
     OLHOS
======================================================= -->

<div class="face-container">

    <div class="eyes-row">

        <div
            id="eye-l"
            class="eye">
        </div>

        <div
            id="eye-r"
            class="eye">
        </div>

    </div>

</div>


<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

const body = document.body;

let recognition = null;

let recognitionActive = false;

let robotSpeaking = false;

let startingRecognition = false;

let robotAwake = false;

let step = "nome";

let userName = "";

let wakeLock = null;

let voices = [];


/* =========================================================
   RECONHECIMENTO DE VOZ
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "pt-BR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;
}


/* =========================================================
   VOZES
========================================================= */

function carregarVozes() {

    voices =
        window.speechSynthesis.getVoices();
}

carregarVozes();

if ("onvoiceschanged" in speechSynthesis) {

    speechSynthesis.onvoiceschanged =
        carregarVozes;
}


/* =========================================================
   ESCOLHER VOZ
========================================================= */

function escolherVoz() {

    carregarVozes();

    /*
     * Procuramos primeiro uma voz
     * brasileira disponível.
     */

    let voz =
        voices.find(v =>
            v.lang &&
            v.lang.toLowerCase() === "pt-br"
        );

    /*
     * Caso não exista exatamente
     * pt-BR, procura português.
     */

    if (!voz) {

        voz =
            voices.find(v =>
                v.lang &&
                v.lang
                    .toLowerCase()
                    .startsWith("pt")
            );
    }

    return voz || null;
}


/* =========================================================
   TELA SEMPRE ACESA
========================================================= */

async function manterTelaAcesa() {

    try {

        if (!("wakeLock" in navigator)) {

            console.log(
                "Wake Lock não disponível."
            );

            return;
        }

        if (
            wakeLock &&
            !wakeLock.released
        ) {

            return;
        }

        wakeLock =
            await navigator.wakeLock.request(
                "screen"
            );

        console.log(
            "Tela mantida acesa."
        );

    }
    catch (erro) {

        console.log(
            "Wake Lock:",
            erro
        );
    }
}


/* =========================================================
   FULLSCREEN
========================================================= */

async function entrarFullscreen() {

    try {

        if (document.fullscreenElement) {

            return;
        }

        const elemento =
            document.documentElement;

        if (
            elemento.requestFullscreen
        ) {

            await elemento.requestFullscreen();

            console.log(
                "Fullscreen ativado."
            );

            return;
        }

        if (
            elemento.webkitRequestFullscreen
        ) {

            elemento.webkitRequestFullscreen();

            console.log(
                "Fullscreen WebKit ativado."
            );
        }

    }
    catch (erro) {

        /*
         * Se o navegador bloquear,
         * o robô continua funcionando.
         */

        console.log(
            "Fullscreen não permitido:",
            erro
        );
    }
}


/* =========================================================
   ATIVAÇÃO DO MODO APRESENTAÇÃO
========================================================= */

function prepararTela() {

    /*
     * Não usamos await aqui.
     *
     * Isso é proposital para que
     * o navegador reconheça a chamada
     * como resultado direto do toque.
     */

    entrarFullscreen();

    manterTelaAcesa();
}


/* =========================================================
   RECUPERAR WAKE LOCK
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            manterTelaAcesa();
        }
    }
);


/* =========================================================
   INICIAR MICROFONE
========================================================= */

function iniciarMicrofone() {

    if (!recognition) {

        console.log(
            "Reconhecimento de voz não disponível."
        );

        return;
    }

    if (recognitionActive) {

        return;
    }

    if (startingRecognition) {

        return;
    }

    startingRecognition = true;

    try {

        recognition.start();

    }
    catch (erro) {

        console.log(
            "Microfone:",
            erro
        );

        startingRecognition = false;
    }
}


/* =========================================================
   FALA
========================================================= */

function falar(
    texto,
    callback
) {

    robotSpeaking = true;


    /*
     * Para o reconhecimento enquanto
     * o robô está falando.
     */

    if (
        recognition &&
        recognitionActive
    ) {

        try {

            recognition.stop();

        }
        catch (e) {}
    }


    /*
     * Cancela fala anterior.
     */

    speechSynthesis.cancel();


    const mensagem =
        new SpeechSynthesisUtterance(
            texto
        );


    mensagem.lang =
        "pt-BR";


    /*
     * VOZ
     *
     * Não usamos pitch 0.2.
     *
     * Isso fica horrível em alguns
     * celulares.
     *
     * 0.75 = mais grave
     * 0.92 = mais lenta
     */

    mensagem.pitch =
        0.75;

    mensagem.rate =
        0.92;

    mensagem.volume =
        1;


    const voz =
        escolherVoz();


    if (voz) {

        mensagem.voice =
            voz;
    }


    mensagem.onstart = () => {

        robotSpeaking =
            true;
    };


    mensagem.onend = () => {

        robotSpeaking =
            false;


        /*
         * Só depois que o robô
         * terminar de falar
         * ativamos novamente
         * o microfone.
         */

        setTimeout(
            () => {

                if (
                    recognitionActive &&
                    !robotSpeaking
                ) {

                    iniciarMicrofone();
                }

            },
            600
        );


        if (callback) {

            callback();
        }
    };


    mensagem.onerror = () => {

        robotSpeaking =
            false;
    };


    speechSynthesis.speak(
        mensagem
    );
}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizar(texto) {

    return texto

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[.,!?;:]/g,
            ""
        )

        .trim();
}


/* =========================================================
   EXTRAIR NOME
========================================================= */

function extrairNome(fala) {

    let texto =
        normalizar(fala);


    texto =
        texto.replace(
            /^meu nome e\s+/,
            ""
        );


    texto =
        texto.replace(
            /^eu sou\s+/,
            ""
        );


    texto =
        texto.trim();


    const partes =
        texto.split(/\s+/);


    return partes[0] || "";
}


/* =========================================================
   CONTINUAR DIÁLOGO
========================================================= */

function continuarDialogo() {

    step =
        "decisao_piada";

    body.className =
        "awake";


    setTimeout(
        () => {

            falar(

                "Legal te conhecer! Eu sou um protótipo de um projeto educacional. Quer ouvir uma piada?",

                () => {

                    step =
                        "decisao_piada";
                }
            );

        },
        400
    );
}


/* =========================================================
   PROCESSAR RAFAEL
========================================================= */

function processarRafael(
    fala
) {

    const texto =
        normalizar(fala);


    /* PROFESSOR */

    if (
        texto.includes("professor")
    ) {

        body.className =
            "happy";

        falar(

            "Eaí meu, legal te conhecer!",

            continuarDialogo
        );

        return;
    }


    /* COORDENADOR */

    if (
        texto.includes("coordenador")
    ) {

        body.className =
            "happy";

        falar(

            "Legal te conhecer!",

            continuarDialogo
        );

        return;
    }


    /* ALUNO */

    if (
        texto.includes("aluno")
    ) {

        body.className =
            "happy";

        falar(

            "Legal te conhecer!",

            continuarDialogo
        );

        return;
    }


    /* NÃO ENTENDEU */

    body.className =
        "thinking";

    falar(

        "Não entendi. Você é aluno, professor ou coordenador?",

        () => {

            step =
                "rafael";
        }
    );
}


/* =========================================================
   PIADA
========================================================= */

function contarPiada() {

    body.className =
        "awake";


    falar(

        "Sabe por que o robô foi ao médico? Porque ele estava com um vírus! Rá! Rá! Rá! Rá!",

        () => {


            /*
             * EXPRESSÃO DE RISADA
             */

            body.className =
                "laughing";


            setTimeout(
                () => {

                    body.className =
                        "awake";


                    falar(

                        "O papo está bom, mas minha bateria está acabando, então vou indo, tchau tchau!",

                        () => {

                            body.className =
                                "sleeping";

                            robotAwake =
                                false;

                            recognitionActive =
                                false;

                            if (recognition) {

                                try {

                                    recognition.stop();

                                }
                                catch (e) {}
                            }
                        }
                    );

                },
                2000
            );

        }
    );
}


/* =========================================================
   PISCAR
========================================================= */

setInterval(
    () => {

        if (
            !body.classList.contains(
                "sleeping"
            )
        ) {

            body.classList.add(
                "blink"
            );


            setTimeout(
                () => {

                    body.classList.remove(
                        "blink"
                    );

                },
                150
            );
        }

    },
    4000
);


/* =========================================================
   ACORDAR ROBÔ
========================================================= */

function acordarRobo() {

    /*
     * Evita acordar duas vezes.
     */

    if (robotAwake) {

        return;
    }


    robotAwake =
        true;


    /*
     * PRIMEIRA COISA:
     *
     * fullscreen + tela acesa.
     */

    prepararTela();


    /*
     * Visualmente acorda.
     */

    body.className =
        "awake";


    /*
     * Reseta conversa.
     */

    step =
        "nome";


    userName =
        "";


    /*
     * Marca reconhecimento como
     * ativo antes da fala.
     *
     * Assim o onend da fala
     * consegue iniciar o microfone.
     */

    if (recognition) {

        recognitionActive =
            true;
    }


    /*
     * Fala PRIMEIRO.
     *
     * Depois da fala o microfone
     * será iniciado automaticamente.
     */

    falar(

        "Olá! Eu sou o robozinho. Qual o seu nome?"

    );
}


/* =========================================================
   TOQUE ÚNICO PARA ACORDAR
========================================================= */

/*
 * USAMOS APENAS POINTERDOWN.
 *
 * Isso evita o problema da versão
 * anterior onde click + touchend
 * disparavam juntos.
 */

document.addEventListener(
    "pointerdown",
    event => {

        /*
         * Somente primeiro toque/clique.
         */

        if (
            event.pointerType ===
                "mouse" ||
            event.pointerType ===
                "touch" ||
            event.pointerType ===
                "pen"
        ) {

            acordarRobo();
        }

    },
    {
        passive: true
    }
);


/* =========================================================
   RECONHECIMENTO DE VOZ
========================================================= */

if (recognition) {


    recognition.onstart =
        () => {

            startingRecognition =
                false;

            recognitionActive =
                true;

            console.log(
                "Microfone ligado."
            );
        };


    recognition.onresult =
        event => {

            if (robotSpeaking) {

                return;
            }


            const ultimo =
                event.results.length - 1;


            const fala =
                event.results[
                    ultimo
                ][0]
                    .transcript
                    .trim();


            console.log(
                "Pessoa disse:",
                fala
            );


            const texto =
                normalizar(
                    fala
                );


            /* =================================================
               NOME
            ================================================= */

            if (
                step === "nome"
            ) {


                /*
                 * EDCARMEN / EDICARMEN
                 */

                if (

                    texto.includes(
                        "edicarmen"
                    )

                    ||

                    texto.includes(
                        "edcarmen"
                    )

                ) {

                    userName =
                        "Edcarmen";

                    body.className =
                        "happy";

                    falar(

                        "Busquei aqui no meu banco de dados e vi que Edcarmen é coordenadora da escola Amácio Mazzaroppi.",

                        continuarDialogo
                    );

                    return;
                }


                /*
                 * RAFAEL
                 */

                if (
                    texto.includes(
                        "rafael"
                    )
                ) {

                    userName =
                        "Rafael";

                    body.className =
                        "thinking";

                    falar(

                        "Busquei aqui no meu banco de dados e vi que existe Rafael aluno, Rafael professor e Rafael coordenador. Qual você é?",

                        () => {

                            step =
                                "rafael";
                        }
                    );

                    return;
                }


                /*
                 * LARA
                 */

                if (
                    texto.includes(
                        "lara"
                    )
                ) {

                    userName =
                        "Lara";

                    body.className =
                        "happy";

                    falar(

                        "Hi Teacher, nice to meet you!",

                        continuarDialogo
                    );

                    return;
                }


                /*
                 * OUTROS NOMES
                 */

                userName =
                    extrairNome(
                        fala
                    );


                if (!userName) {

                    userName =
                        "amigo";
                }


                body.className =
                    "happy";


                falar(

                    `Legal te conhecer, ${userName}! Eu sou um protótipo de um projeto educacional.`,

                    () => {

                        setTimeout(
                            () => {

                                falar(

                                    "Quer ouvir uma piada?",

                                    () => {

                                        step =
                                            "decisao_piada";
                                    }
                                );

                            },
                            400
                        );

                    }
                );

                return;
            }


            /* =================================================
               RAFAEL
            ================================================= */

            if (
                step === "rafael"
            ) {

                processarRafael(
                    fala
                );

                return;
            }


            /* =================================================
               PIADA
            ================================================= */

            if (
                step ===
                "decisao_piada"
            ) {


                /*
                 * SIM
                 */

                if (

                    texto.includes(
                        "sim"
                    )

                    ||

                    texto.includes(
                        "quero"
                    )

                    ||

                    texto.includes(
                        "pode"
                    )

                    ||

                    texto.includes(
                        "claro"
                    )

                ) {

                    contarPiada();

                    return;
                }


                /*
                 * NÃO
                 */

                if (

                    texto.includes(
                        "nao"
                    )

                    ||

                    texto.includes(
                        "não"
                    )

                ) {

                    falar(

                        "Vou contar mesmo assim!",

                        () => {

                            contarPiada();
                        }
                    );

                    return;
                }


                /*
                 * Qualquer outra resposta
                 */

                falar(

                    "Vou contar mesmo assim!",

                    () => {

                        contarPiada();
                    }
                );
            }

        };


    recognition.onend =
        () => {

            startingRecognition =
                false;


            /*
             * Se o robô ainda estiver
             * conversando, liga novamente.
             */

            if (

                recognitionActive &&

                robotAwake &&

                !robotSpeaking

            ) {

                setTimeout(
                    () => {

                        iniciarMicrofone();

                    },
                    500
                );
            }
        };


    recognition.onerror =
        event => {

            startingRecognition =
                false;

            console.log(
                "Erro do microfone:",
                event.error
            );


            /*
             * Não derruba o robô
             * se o navegador der erro.
             */

            if (
                event.error ===
                    "not-allowed" ||
                event.error ===
                    "service-not-allowed"
            ) {

                console.log(
                    "Permissão de microfone necessária."
                );
            }
        };
}


/* =========================================================
   BLOQUEAR ZOOM POR GESTO
========================================================= */

document.addEventListener(
    "gesturestart",
    e => {

        e.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gesturechange",
    e => {

        e.preventDefault();

    },
    {
        passive: false
    }
);

document.addEventListener(
    "gestureend",
    e => {

        e.preventDefault();

    },
    {
        passive: false
    }
);

</script>

</body>
</html>
