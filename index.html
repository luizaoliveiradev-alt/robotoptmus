<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#050505">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Robô Interativo</title>

<style>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

:root {

    --eye-white: #f0faff;

    --dark-bg: #050505;

    --glow-soft:
        rgba(240,250,255,0.15);
}


* {

    box-sizing: border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    background:
        var(--dark-bg);

    overflow: hidden;

    touch-action: manipulation;

    overscroll-behavior: none;

    user-select: none;

    -webkit-user-select: none;

}


body {

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100dvh;

}


/* =========================================================
   AVISO DE ORIENTAÇÃO
========================================================= */

#orientation-overlay {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    background: #000;

    color: white;

    z-index: 999999;

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    font-family: Arial,sans-serif;

}


#orientation-overlay div {

    font-size: 50px;

}


#orientation-overlay p {

    font-size: 18px;

}


@media (orientation: portrait) {

    #orientation-overlay {

        display: flex;

    }

}


/* =========================================================
   ROSTO
========================================================= */

.face-container {

    width: 100vw;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    animation:
        float 5s ease-in-out infinite;

}


@keyframes float {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-12px);

    }

}


/* =========================================================
   OLHOS
========================================================= */

.eyes-row {

    width: 100vw;

    display: flex;

    justify-content: center;

    align-items: center;

    gap:
        clamp(60px,11vw,160px);

}


.eye {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(150px,20vw,290px);

    background:
        var(--eye-white);

    border-radius: 80px;

    box-shadow:

        0 0 30px
        var(--glow-soft),

        0 0 70px
        rgba(240,250,255,0.07);

    transition:

        all .4s
        cubic-bezier(
            .175,
            .885,
            .32,
            1.275
        );

}


/* =========================================================
   DORMINDO
========================================================= */

.sleeping .eye {

    width:
        clamp(140px,18vw,260px);

    height: 8px;

    opacity: .2;

    border-radius: 4px;

}


/* =========================================================
   FELIZ
========================================================= */

.happy .eye {

    height:
        clamp(70px,10vw,130px);

    background:
        transparent;

    border-top:
        clamp(18px,2.5vw,30px)
        solid
        var(--eye-white);

    border-radius:
        100px 100px 0 0;

    box-shadow:
        none;

    transform:
        translateY(25px);

}


/* =========================================================
   PENSANDO
========================================================= */

.thinking #eye-l {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(150px,20vw,290px);

}


.thinking #eye-r {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(100px,15vw,210px);

}


/* =========================================================
   RINDO
========================================================= */

.laughing .eye {

    width:
        clamp(170px,22vw,330px);

    height:
        clamp(40px,6vw,75px);

    transform:
        skewX(10deg);

}


/* =========================================================
   PISCADA
========================================================= */

.blink .eye {

    transform:
        scaleY(0) !important;

}


/* =========================================================
   MOBILE / TELAS BAIXAS
========================================================= */

@media (max-height:500px)
and (orientation:landscape) {

    .eye {

        width:20vw;

        height:17vw;

        max-width:270px;

        max-height:225px;

    }


    .eyes-row {

        gap:10vw;

    }

}

</style>

</head>


<body class="sleeping">


<div id="orientation-overlay">

    <div>📱🔄</div>

    <p>
        Gire o dispositivo para deitado.
    </p>

</div>


<div class="face-container">

    <div class="eyes-row">

        <div
            id="eye-l"
            class="eye">
        </div>

        <div
            id="eye-r"
            class="eye">
        </div>

    </div>

</div>


<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

const body =
    document.body;


let recognitionActive =
    false;


let robotSpeaking =
    false;


let step =
    "nome";


let userName =
    "";


let wakeLock =
    null;


let voices =
    [];


let fullscreenAtivado =
    false;


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =

    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const recognition =

    SpeechRecognition
        ? new SpeechRecognition()
        : null;


if (recognition) {

    recognition.lang =
        "pt-BR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;

}


/* =========================================================
   VOICES
========================================================= */

function carregarVozes() {

    voices =
        window.speechSynthesis
            .getVoices();

}


carregarVozes();


if (
    "onvoiceschanged"
    in window.speechSynthesis
) {

    window.speechSynthesis
        .onvoiceschanged =
        carregarVozes;

}


/* =========================================================
   ESCOLHER VOZ
========================================================= */

function escolherVoz() {

    carregarVozes();


    /*
     * Procuramos primeiro vozes
     * masculinas conhecidas.
     */

    const preferencias = [

        "Daniel",
        "Google português",
        "Microsoft Daniel",
        "Microsoft Antonio",
        "Antonio",
        "Felipe",
        "Ricardo",
        "Luciano",
        "male"

    ];


    for (
        const preferencia
        of preferencias
    ) {

        const encontrada =
            voices.find(
                voice =>
                    voice.name
                        .toLowerCase()
                        .includes(
                            preferencia
                                .toLowerCase()
                        )
                    &&
                    voice.lang
                        .toLowerCase()
                        .startsWith("pt")
            );


        if (encontrada) {

            return encontrada;

        }

    }


    /*
     * Depois tenta qualquer
     * voz brasileira.
     */

    const brasileira =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .includes("pt-br")
        );


    if (brasileira) {

        return brasileira;

    }


    return null;

}


/* =========================================================
   WAKE LOCK
========================================================= */

async function ativarWakeLock() {

    try {

        if (
            "wakeLock"
            in navigator
        ) {

            if (
                wakeLock &&
                !wakeLock.released
            ) {

                return;

            }


            wakeLock =
                await navigator
                    .wakeLock
                    .request(
                        "screen"
                    );


            console.log(
                "Wake Lock ativado."
            );

        }

    }

    catch (erro) {

        console.log(
            "Wake Lock:",
            erro
        );

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function ativarFullscreen() {

    /*
     * Fullscreen precisa ser chamado
     * diretamente a partir de uma
     * interação do usuário no celular.
     */

    try {

        if (
            document.fullscreenElement
        ) {

            fullscreenAtivado =
                true;

            return;

        }


        const elemento =
            document.documentElement;


        if (
            elemento.requestFullscreen
        ) {

            await elemento
                .requestFullscreen();

            fullscreenAtivado =
                true;

            console.log(
                "Fullscreen ativado."
            );

            return;

        }


        /*
         * Samsung / navegadores
         * que disponibilizam webkit.
         */

        if (
            elemento.webkitRequestFullscreen
        ) {

            elemento
                .webkitRequestFullscreen();

            fullscreenAtivado =
                true;

            return;

        }

    }

    catch (erro) {

        console.log(
            "Fullscreen bloqueado pelo navegador:",
            erro
        );

    }

}


/* =========================================================
   ATIVAR MODO APRESENTAÇÃO
========================================================= */

async function ativarModoTela() {

    await ativarFullscreen();

    await ativarWakeLock();

}


/* =========================================================
   SE VOLTAR PARA A PÁGINA
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            await ativarWakeLock();

        }

    }
);


/* =========================================================
   FALAR
========================================================= */

function falar(
    texto,
    callback
) {

    robotSpeaking =
        true;


    /*
     * Desliga microfone
     * durante a fala.
     */

    if (
        recognition &&
        recognitionActive
    ) {

        try {

            recognition.stop();

        }

        catch (e) {}

    }


    window.speechSynthesis
        .cancel();


    const msg =
        new SpeechSynthesisUtterance(
            texto
        );


    msg.lang =
        "pt-BR";


    /*
     * =====================================================
     * CONFIGURAÇÃO DA VOZ
     * =====================================================
     *
     * Não usamos pitch extremamente baixo.
     *
     * No celular isso costuma deixar
     * a voz horrível.
     *
     * 0.70 = mais grave
     * 0.90 = natural/lenta
     */

    msg.pitch =
        0.70;


    msg.rate =
        0.90;


    msg.volume =
        1;


    const voz =
        escolherVoz();


    if (voz) {

        msg.voice =
            voz;

    }


    msg.onstart = () => {

        robotSpeaking =
            true;

    };


    msg.onend = () => {

        robotSpeaking =
            false;


        setTimeout(() => {

            if (
                recognition &&
                recognitionActive
            ) {

                try {

                    recognition.start();

                }

                catch (e) {}

            }

        }, 500);


        if (callback) {

            callback();

        }

    };


    msg.onerror = () => {

        robotSpeaking =
            false;

    };


    window.speechSynthesis
        .speak(msg);

}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizar(texto) {

    return texto

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[.,!?;:]/g,
            ""
        )

        .trim();

}


/* =========================================================
   EXTRAIR NOME
========================================================= */

function extrairNome(fala) {

    let texto =
        normalizar(fala);


    texto =
        texto.replace(
            /^meu nome e\s+/,
            ""
        );


    texto =
        texto.replace(
            /^eu sou\s+/,
            ""
        );


    texto =
        texto.trim();


    const partes =
        texto.split(/\s+/);


    return partes[0] || "";

}


/* =========================================================
   CONTINUAÇÃO
========================================================= */

function continuarDialogo() {

    step =
        "decisao_piada";


    body.className =
        "awake";


    falar(

        "Legal! Eu sou um protótipo de um projeto educacional. Quer ouvir uma piada?",

        () => {

            step =
                "decisao_piada";

        }

    );

}


/* =========================================================
   RAFAEL
========================================================= */

function processarRafael(
    fala
) {

    const texto =
        normalizar(fala);


    /*
     * PROFESSOR
     */

    if (
        texto.includes(
            "professor"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Eaí meu, legal te conhecer!",

            continuarDialogo

        );


        return;

    }


    /*
     * COORDENADOR
     */

    if (
        texto.includes(
            "coordenador"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Legal te conhecer!",

            continuarDialogo

        );


        return;

    }


    /*
     * ALUNO
     */

    if (
        texto.includes(
            "aluno"
        )
    ) {

        body.className =
            "happy";


        falar(

            "Legal te conhecer!",

            continuarDialogo

        );


        return;

    }


    /*
     * Não entendeu.
     */

    body.className =
        "thinking";


    falar(

        "Não entendi. Você é aluno, professor ou coordenador?",

        () => {

            step =
                "rafael";

        }

    );

}


/* =========================================================
   PIADA
========================================================= */

function contarPiada() {

    body.className =
        "awake";


    falar(

        "Sabe por que o robô foi ao médico? Porque ele estava com um vírus! Rá! Rá! Rá! Rá!",

        () => {


            /*
             * EXPRESSÃO DE RISADA
             */

            body.className =
                "laughing";


            setTimeout(() => {


                body.className =
                    "awake";


                falar(

                    "O papo está bom, mas minha bateria está acabando, então vou indo. Tchau tchau!",

                    () => {


                        body.className =
                            "sleeping";


                        recognitionActive =
                            false;


                        if (recognition) {

                            try {

                                recognition.stop();

                            }

                            catch (e) {}

                        }

                    }

                );


            }, 2000);

        }

    );

}


/* =========================================================
   PISCADA
========================================================= */

setInterval(() => {

    if (
        !body.classList
            .contains(
                "sleeping"
            )
    ) {

        body.classList
            .add(
                "blink"
            );


        setTimeout(() => {

            body.classList
                .remove(
                    "blink"
                );

        }, 150);

    }

}, 4000);


/* =========================================================
   ACORDAR
========================================================= */

async function acordarRobo() {

    /*
     * IMPORTANTE:
     *
     * Essas funções são executadas
     * diretamente depois do toque.
     *
     * Isso aumenta muito a compatibilidade
     * com Chrome Android / Samsung Internet /
     * navegadores mobile.
     */

    await ativarModoTela();


    if (
        !recognitionActive &&
        recognition
    ) {

        body.className =
            "awake";


        recognitionActive =
            true;


        step =
            "nome";


        try {

            recognition.start();


            falar(

                "Olá! Eu sou o robozinho. Qual o seu nome?"

            );

        }

        catch (erro) {

            console.log(
                "Erro ao iniciar microfone:",
                erro
            );


            recognitionActive =
                false;

        }

    }

}


/* =========================================================
   TOQUE NA TELA
========================================================= */

document.addEventListener(

    "click",

    acordarRobo

);


/*
 * Também funciona com touch.
 *
 * O navegador mobile costuma
 * liberar fullscreen pelo touch.
 */

document.addEventListener(

    "touchend",

    async event => {

        await ativarModoTela();

    },

    {
        passive: true
    }

);


/* =========================================================
   RECONHECIMENTO
========================================================= */

if (recognition) {


    recognition.onresult =
        event => {


            if (
                robotSpeaking
            ) {

                return;

            }


            const ultimo =
                event.results.length - 1;


            const fala =

                event.results[
                    ultimo
                ][0]
                    .transcript
                    .toLowerCase()
                    .trim();


            console.log(
                "Pessoa:",
                fala
            );


            const texto =
                normalizar(
                    fala
                );


            /* =================================================
               NOME
            ================================================= */

            if (
                step === "nome"
            ) {


                /*
                 * ==============================================
                 * EDICARMEN
                 * ==============================================
                 */

                if (

                    texto.includes(
                        "edicarmen"
                    )

                    ||

                    texto.includes(
                        "edcarmen"
                    )

                ) {

                    userName =
                        "Edcarmen";


                    body.className =
                        "happy";


                    falar(

                        "Busquei aqui no meu banco de dados e vi que Edcarmen é coordenadora da escola Amácio Mazzaroppi.",

                        continuarDialogo

                    );


                    return;

                }


                /*
                 * ==============================================
                 * RAFAEL
                 * ==============================================
                 */

                if (
                    texto.includes(
                        "rafael"
                    )
                ) {

                    userName =
                        "Rafael";


                    body.className =
                        "thinking";


                    falar(

                        "Busquei aqui no meu banco de dados e vi que existe Rafael aluno, Rafael professor e Rafael coordenador. Qual você é?",

                        () => {

                            step =
                                "rafael";

                        }

                    );


                    return;

                }


                /*
                 * ==============================================
                 * LARA
                 * ==============================================
                 */

                if (
                    texto.includes(
                        "lara"
                    )
                ) {

                    userName =
                        "Lara";


                    body.className =
                        "happy";


                    falar(

                        "Hi Teacher, nice to meet you!",

                        continuarDialogo

                    );


                    return;

                }


                /*
                 * ==============================================
                 * QUALQUER OUTRO NOME
                 * ==============================================
                 */

                userName =
                    extrairNome(
                        fala
                    );


                if (!userName) {

                    userName =
                        "amigo";

                }


                body.className =
                    "happy";


                falar(

                    `Legal te conhecer, ${userName}! Eu sou um protótipo de um projeto educacional.`,

                    () => {

                        setTimeout(
                            () => {

                                falar(

                                    "Quer ouvir uma piada?",

                                    () => {

                                        step =
                                            "decisao_piada";

                                    }

                                );

                            },
                            400
                        );

                    }

                );


                return;

            }


            /* =================================================
               RAFAEL
            ================================================= */

            if (
                step === "rafael"
            ) {

                processarRafael(
                    fala
                );

                return;

            }


            /* =================================================
               PIADA
            ================================================= */

            if (
                step ===
                "decisao_piada"
            ) {


                /*
                 * SIM
                 */

                if (

                    texto.includes(
                        "sim"
                    )

                    ||

                    texto.includes(
                        "quero"
                    )

                    ||

                    texto.includes(
                        "pode"
                    )

                    ||

                    texto.includes(
                        "claro"
                    )

                ) {

                    contarPiada();

                    return;

                }


                /*
                 * NÃO
                 */

                if (

                    texto.includes(
                        "nao"
                    )

                    ||

                    texto.includes(
                        "não"
                    )

                ) {

                    falar(

                        "Vou contar mesmo assim!",

                        () => {

                            contarPiada();

                        }

                    );


                    return;

                }


                /*
                 * Qualquer resposta
                 */

                falar(

                    "Vou contar mesmo assim!",

                    () => {

                        contarPiada();

                    }

                );

            }

        };


    /* =========================================================
       MICROFONE TERMINOU
    ========================================================= */

    recognition.onend =
        () => {

            if (
                recognitionActive &&
                !robotSpeaking
            ) {

                setTimeout(() => {

                    try {

                        recognition.start();

                    }

                    catch (e) {}

                }, 350);

            }

        };


    recognition.onerror =
        event => {

            console.log(
                "Speech error:",
                event.error
            );

        };

}


/* =========================================================
   BLOQUEAR ZOOM
========================================================= */

document.addEventListener(
    "gesturestart",
    e => e.preventDefault()
);

document.addEventListener(
    "gesturechange",
    e => e.preventDefault()
);

document.addEventListener(
    "gestureend",
    e => e.preventDefault()
);

</script>

</body>

</html>
